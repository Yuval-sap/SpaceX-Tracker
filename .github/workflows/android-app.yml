name: Build Android app

# Builds the Android app (android-app/ - the site in the app's own WebView) on GitHub's servers, so no Android tools
# are needed on any computer. Runs when the app's code changes, or by hand from the Actions tab (Run workflow).
# The finished APK is attached to the "android-latest" release, so it always has the same download link:
#   https://github.com/Yuval-sap/SpaceX-Tracker/releases/download/android-latest/spacex-tracker.apk
#
# Signed with the release key from the repository's secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them it is signed with a throwaway test key, and published only as a test build (never as the release).
on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Release key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release key in the repository's secrets - this build is signed with a test key"
            echo "signed=test" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle -p android-app assembleRelease --no-daemon --stacktrace \
            -PversionCode=$((100 + ${{ github.run_number }})) -PversionName="2.${{ github.run_number }}" 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp android-app/app/build/outputs/apk/release/app-release.apk spacex-tracker.apk

      # A failed build's errors as annotations on the run, so they can be read without opening the log
      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|e: |What went wrong|FAILED|Exception" "$RUNNER_TEMP/build.log" | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done || true

      - uses: actions/upload-artifact@v4
        with:
          name: spacex-tracker-apk
          path: spacex-tracker.apk

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          TAG=android-latest
          [ "$SIGNED" = "test" ] && TAG=android-test
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Android app ($TAG)" \
            --notes "The SpaceX Tracker Android app. Download spacex-tracker.apk below and open it on the phone." --prerelease
          gh release upload "$TAG" spacex-tracker.apk --clobber
