<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb4f0"/>
      <stop offset="0.75" stop-color="#bfe3fb"/>
      <stop offset="1" stop-color="#e6f5fd"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a86c7"/>
      <stop offset="1" stop-color="#0b3a63"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d1d9"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#aeb8c2"/>
    </linearGradient>
    <linearGradient id="inter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15181c"/>
      <stop offset="0.4" stop-color="#3a3f46"/>
      <stop offset="1" stop-color="#0d0f12"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8955a"/>
      <stop offset="1" stop-color="#9c6b37"/>
    </linearGradient>
    <clipPath id="aboveWater"><rect x="0" y="0" width="1600" height="560"/></clipPath>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1300" cy="150" r="70" fill="#fff6c9"/>
  <circle cx="1300" cy="150" r="110" fill="#fff6c9" opacity="0.25"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="260" cy="170" rx="110" ry="34"/><ellipse cx="330" cy="150" rx="80" ry="40"/><ellipse cx="200" cy="160" rx="60" ry="28"/>
    <ellipse cx="980" cy="110" rx="90" ry="26"/><ellipse cx="1040" cy="96" rx="60" ry="30"/>
  </g>

  <!-- the booster, sinking at an angle - only its top sticks out of the water -->
  <g clip-path="url(#aboveWater)">
    <g transform="translate(700 560) rotate(-18)">
      <rect x="-55" y="-330" width="110" height="520" rx="6" fill="url(#body)"/>
      <!-- interstage -->
      <rect x="-57" y="-400" width="114" height="92" rx="4" fill="url(#inter)"/>
      <rect x="-57" y="-312" width="114" height="6" fill="#0d0f12" opacity="0.6"/>
      <!-- a panel line and a black band -->
      <!-- soot from the flight, streaked down the side -->
      <path d="M -55 -300 C -40 -220 -48 -120 -30 40 L -55 40 Z" fill="#4a4f55" opacity="0.28"/>
      <path d="M -20 -300 C -12 -200 -22 -90 -8 40 L -18 40 C -30 -80 -26 -200 -34 -300 Z" fill="#4a4f55" opacity="0.18"/>
      <path d="M 30 -300 C 36 -240 30 -150 42 40 L 55 40 L 55 -300 Z" fill="#4a4f55" opacity="0.22"/>
      <rect x="-55" y="-150" width="110" height="5" fill="#9aa5b0"/>
      <rect x="-55" y="-60" width="110" height="3" fill="#9aa5b0"/>
    </g>
  </g>

  <!-- a gull perched on the very top, unimpressed -->
  <g transform="translate(582 150) rotate(-18)">
    <ellipse cx="0" cy="0" rx="34" ry="20" fill="#ffffff" stroke="#8f9aa5" stroke-width="3"/>
    <path d="M -10 -6 Q 12 -30 34 -8 Q 14 -12 -10 -6 Z" fill="#9aa5b0"/>
    <circle cx="-26" cy="-14" r="15" fill="#ffffff" stroke="#8f9aa5" stroke-width="3"/>
    <circle cx="-30" cy="-17" r="3" fill="#1b1f24"/>
    <path d="M -40 -12 L -58 -8 L -40 -6 Z" fill="#f4a93b"/>
    <path d="M -6 18 L -6 28 M 6 18 L 6 28" stroke="#f4a93b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- sea -->
  <path d="M0 548 Q 50 534 100 548 T 200 548 T 300 548 T 400 548 T 500 548 T 600 548 T 700 548 T 800 548 T 900 548 T 1000 548 T 1100 548 T 1200 548 T 1300 548 T 1400 548 T 1500 548 T 1600 548 V 900 H 0 Z" fill="url(#sea)"/>
  <!-- ripples around the booster -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.85">
    <ellipse cx="712" cy="565" rx="120" ry="16" stroke-width="5"/>
    <ellipse cx="712" cy="568" rx="190" ry="26" stroke-width="3" opacity="0.6"/>
    <ellipse cx="712" cy="572" rx="270" ry="38" stroke-width="2" opacity="0.35"/>
  </g>
  <!-- wave strokes -->
  <g fill="none" stroke="#9fd3f5" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M120 640 q 30 -12 60 0"/><path d="M300 700 q 30 -12 60 0"/><path d="M1080 650 q 30 -12 60 0"/>
    <path d="M1300 740 q 30 -12 60 0"/><path d="M480 800 q 30 -12 60 0"/><path d="M900 780 q 30 -12 60 0"/>
  </g>
  <!-- bubbles -->
  <g fill="none" stroke="#ffffff" stroke-width="3">
    <circle cx="790" cy="520" r="10"/><circle cx="812" cy="486" r="7"/><circle cx="800" cy="452" r="5"/>
    <circle cx="640" cy="528" r="8"/><circle cx="628" cy="500" r="5"/>
  </g>

  <!-- floating sign: R.I.P. and an empty fuel gauge -->
  <g transform="translate(1110 470) rotate(6)">
    <rect x="-8" y="60" width="16" height="100" fill="#8a5a2b"/>
    <rect x="-150" y="-80" width="300" height="170" rx="12" fill="url(#wood)" stroke="#7a4f24" stroke-width="5"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Orbitron, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="52" fill="#3b2410">R.I.P.</text>
    <!-- fuel gauge on E -->
    <g transform="translate(0 66)">
      <path d="M -46 0 A 46 46 0 0 1 46 0" fill="none" stroke="#3b2410" stroke-width="5"/>
      <text x="-54" y="4" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#b3261e">E</text>
      <text x="46" y="4" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#3b2410">F</text>
      <line x1="0" y1="0" x2="-40" y2="-10" stroke="#b3261e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="6" fill="#3b2410"/>
    </g>
  </g>
  <!-- the sign's float -->
  <ellipse cx="1112" cy="628" rx="70" ry="14" fill="#e85d3c"/>
  <ellipse cx="1112" cy="624" rx="70" ry="12" fill="#ff7a55"/>
</svg>
