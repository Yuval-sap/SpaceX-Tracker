<style>
  :root{--accent:#eea774;--fg:#e9ecf1;--mute:#7b8392;--line:rgba(255,255,255,.1);--panel:rgba(12,14,19,.74)}
  html,body{margin:0;height:100%;background:#05070b;color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:2}
  .brand{position:absolute;left:28px;top:22px}
  .eyebrow{font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
  .brand h1{margin:9px 0 0;font-weight:500;font-size:44px;letter-spacing:.16em;line-height:1}

  .brand .mission{margin-top:7px;color:#d6dbe3;font-size:13px;font-weight:500;letter-spacing:.01em}
  #parts{position:absolute;left:28px;top:152px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:auto}

  #stats b{font-weight:500;font-size:14px;color:var(--fg);white-space:nowrap}
  #card{position:absolute;right:28px;top:80px;width:310px;background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:16px 18px 16px;pointer-events:auto;opacity:0;transform:translateY(-6px);visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s}

  #card p{margin:0;font-size:12.5px;line-height:1.55;color:#c3c9d3}
  #card .row{display:flex;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  #card .row div{flex:1;min-width:0;text-align:start}
  #card .row span{display:block;font:500 10.5px/1.1 'JetBrains Mono',monospace;letter-spacing:.1em;color:#aeb6c3;text-transform:uppercase}
  #card .row b{display:block;margin-top:6px;font:500 11.5px/1.2 'JetBrains Mono',monospace;color:var(--fg)}
  #card .x{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--mute);font-size:16px;cursor:pointer;transition:background-color .15s,color .15s}
  #card .x:hover{background:rgba(255,255,255,.08);color:#fff}
  #controls{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
  #controls .pill{padding:8px 15px}
  #nav{position:absolute;right:22px;bottom:18px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}
  #cube{width:112px;height:112px;cursor:pointer;display:block}
  #nav .navbtns{display:flex;gap:6px}
  #nav .views{display:flex;flex-direction:column;gap:5px;align-items:flex-end;position:absolute;right:124px;bottom:44px}
  #nav .views .pill{padding:6px 11px;font-size:11px}
  #nav .navbtns button{width:32px;height:32px;padding:0;border-radius:50%;font:500 15px/1 Inter,sans-serif;color:#cfd4dc;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:background-color .15s,color .15s,border-color .15s}
  #nav .navbtns button:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff}
  #nav .navbtns button.on,#nav .navbtns button.on:hover{color:#fff;background:var(--accent);border-color:var(--accent)}
  #pivot{position:absolute;left:0;top:0;width:12px;height:12px;margin:-7px 0 0 -7px;border:1.5px solid var(--accent);border-radius:50%;box-shadow:0 0 0 4px rgba(238,167,116,.16);opacity:0;transition:opacity .15s;pointer-events:none}
  #hint{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--mute);white-space:normal;text-align:center;line-height:1.6;width:max-content;max-width:min(1100px,calc(100vw - 520px));transition:opacity .8s;text-transform:uppercase}
  #scale-lbls{position:absolute;inset:0;pointer-events:none}
  #scale-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #scale-svg .sh{stroke:rgba(0,0,0,.45);stroke-width:3;stroke-linecap:round}
  #scale-svg .ln{stroke:#eef2f8;stroke-width:1.25;stroke-linecap:round}
  html.day #scale-svg .sh{stroke:rgba(255,255,255,.7)}
  html.day #scale-svg .ln{stroke:#18202c}
  .scale-lbl{position:absolute;left:0;top:0;padding:4px 9px;font:600 13px/1.15 'JetBrains Mono',monospace;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;white-space:nowrap;opacity:0;visibility:hidden}
  #tip{position:absolute;left:0;top:0;padding:6px 9px;font:500 11px/1 Inter,sans-serif;color:#fff;background:rgba(10,12,16,.86);border:1px solid var(--line);border-radius:7px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap}
  #loader{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#05070b;transition:opacity .7s;font:500 11px 'JetBrains Mono',monospace;letter-spacing:.24em;color:var(--mute);text-transform:uppercase}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
  /* day mode (site's light theme) */
  html.day{--fg:#141a23;--mute:#5a6474;--line:rgba(0,0,0,.1);--panel:rgba(255,255,255,.82);--accent:#c2621f}
  html.day body,html.day #loader{background:#e8ecf2}
  html.day #vignette{background:radial-gradient(ellipse at 50% 45%,transparent 60%,rgba(40,50,70,.14) 100%)}
  html.day .pill{color:#1f2733;background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.14)}
  html.day .pill:hover{background:#fff;border-color:rgba(0,0,0,.28);color:#000}
  html.day .pill.on,html.day .pill.on:hover{color:#fff;background:var(--accent);border-color:var(--accent)}
  html.day #stats span,html.day #card .k,html.day #card .row span{color:#4c5666}
  html.day .sep{color:var(--accent)}
  html.day #card p{color:#2a323e}
  html.day .brand .mission{color:#2a323e}
  html.day #tip{background:rgba(255,255,255,.95);color:#111;border-color:rgba(0,0,0,.12)}
  html.day #ss-close{background:rgba(255,255,255,.7)}
  html.day #nav .navbtns button{color:#1f2733;background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.14)}
  html.day #nav .navbtns button.on,html.day #nav .navbtns button.on:hover{color:#fff;background:var(--accent);border-color:var(--accent)}
  /* scripts without Latin letters: no Inter/JetBrains glyphs, and wide tracking breaks them apart */
  html:is([lang=he],[lang=ar],[lang=hi],[lang=zh],[lang=ru]) :is(.brand h1,.eyebrow,.sep,#stats span,#card .k,#card .row span,#hint){letter-spacing:.02em}
  html:is([lang=he],[lang=ar]) body{font-family:Heebo,'Noto Sans Arabic',system-ui,sans-serif}
  html:is([lang=he],[lang=ar],[lang=hi],[lang=zh],[lang=ru]) :is(#stats span,#card .k,#card .row span,#card .row b,.sep,.eyebrow){font-family:Heebo,'Noto Sans Arabic',system-ui,sans-serif;font-size:12px;font-weight:500}
  /* right-to-left languages: mirror the whole overlay */
  html[dir=rtl] .brand{left:auto;right:28px;text-align:right}
  html[dir=rtl] #parts{left:auto;right:28px}          /* flex-start = the right edge in RTL; flex-end pushed everything left */
  html[dir=rtl] .sep{margin-left:0;margin-right:2px}
  html[dir=rtl] .pill i{margin-right:0;margin-left:7px}
  html[dir=rtl] #stats{right:auto;left:28px}
  html[dir=rtl] #card{right:auto;left:28px}
  html[dir=rtl] #card .x{right:auto;left:10px}
  html[dir=rtl] #nav{right:auto;left:22px}
  html[dir=rtl] #nav .views{right:auto;left:124px;align-items:flex-start}
  /* embedded in the site: a close button in the site's own style */
  #ss-close{display:none;position:absolute;top:18px;right:22px;width:38px;height:38px;border-radius:50%;border:2px solid #34d399;background:rgba(5,7,11,.55);color:#34d399;font-size:20px;line-height:1;cursor:pointer;pointer-events:auto;transition:background-color .15s,color .15s,border-color .15s;z-index:3}
  #ss-close:hover{background:rgba(52,211,153,.12);color:#6ee7b7;border-color:#6ee7b7}
  html.embed #ss-close{display:grid;place-items:center}
  html.embed #stats{right:176px}
  #theme-btn{position:absolute;top:18px;right:22px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);font-size:17px;line-height:1;cursor:pointer;pointer-events:auto;display:grid;place-items:center;transition:background-color .15s,border-color .15s;z-index:3}
  #theme-btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3)}
  html.day #theme-btn{background:rgba(255,255,255,.7);border-color:rgba(0,0,0,.14)}
  html.day #theme-btn:hover{background:#fff}
  html.embed #theme-btn{right:70px}
  #share-btn{position:absolute;top:18px;right:70px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);cursor:pointer;pointer-events:auto;display:grid;place-items:center;transition:background-color .15s,border-color .15s;z-index:3;padding:0}
  #share-btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3)}
  #share-btn svg{width:17px;height:17px;display:block}
  html.day #share-btn{background:rgba(255,255,255,.7);border-color:rgba(0,0,0,.14)}
  html.day #share-btn:hover{background:#fff}
  #share-btn.on{border-color:#34d399;color:#34d399}
  html.embed #share-btn{right:118px}
  html[dir=rtl] #share-btn{right:auto;left:70px}
  html.embed[dir=rtl] #share-btn{left:118px}
  #stats{right:124px}                    /* room for the share + day/night buttons */
  html[dir=rtl] #stats{right:auto;left:124px}
  html[dir=rtl] #theme-btn{right:auto;left:22px}
  html.embed[dir=rtl] #theme-btn{left:70px}
  html.embed[dir=rtl] #ss-close{right:auto;left:22px}
  html.embed[dir=rtl] #stats{right:auto;left:176px}
  @media (max-width:1100px) and (min-width:761px){
    #stats .opt{display:none}
    .brand h1{font-size:36px}
  }
  @media (max-height:720px) and (min-width:761px){
    #parts{gap:5px}
    #parts .pill{padding:5px 11px;font-size:11px}
    .sep{margin:3px 0 0 2px}
  }
  @media (max-height:620px) and (min-width:761px){ #hint{display:none} }
  @media (max-width:760px){
    .brand{left:16px;right:16px;top:16px;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px}
    .brand .eyebrow{flex-basis:100%}
    .brand h1{font-size:28px}
    .brand .sub{font-size:11.5px;margin-top:0}
    .brand .mission{flex-basis:100%;min-width:0;overflow:hidden;white-space:nowrap;font-size:11.5px;margin-top:8px}
    #stats{display:none}
    #parts{left:12px;gap:4px}
    #parts .pill{padding:4px 9px;font-size:10.5px}
    .sep{font-size:9.5px;margin:4px 0 0 2px}
    #controls{left:8px;right:8px;transform:none;bottom:max(12px,env(safe-area-inset-bottom));gap:5px;flex-wrap:wrap;justify-content:center}
    #controls .pill{padding:7px 10px;font-size:11px}
    #nav{top:auto;right:10px;bottom:96px;gap:6px;align-items:center}
    #cube{width:84px;height:84px}
    #nav .views{display:none}
    #nav .navbtns button{width:28px;height:28px;font-size:13px}
    #card{left:12px;right:12px;width:auto;top:auto;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 84px);max-height:36vh;overflow-y:auto;padding:12px 14px}
    #hint{display:none}
    html.card-open #nav{display:none}          /* the card takes that corner while it's open */
    html[dir=rtl] .brand{left:16px;right:16px}
    html[dir=rtl] #parts{left:auto;right:12px}
    html[dir=rtl] #nav{left:auto;right:10px}
    html[dir=rtl] #card{left:12px}
    #ss-close{top:12px;right:10px;width:34px;height:34px}
    #theme-btn{top:12px;right:10px;width:34px;height:34px;font-size:15px}
    html.embed #theme-btn{right:52px}
    #share-btn{top:12px;right:52px;width:34px;height:34px}
    #share-btn svg{width:15px;height:15px}
    html.embed #share-btn{right:94px}
    html[dir=rtl] #share-btn{right:auto;left:52px}
    html.embed[dir=rtl] #share-btn{right:auto;left:94px}
    html[dir=rtl] #theme-btn{right:auto;left:10px}
    html.embed[dir=rtl] #theme-btn{right:auto;left:52px}

    html.embed[dir=rtl] #ss-close{left:10px}
  }
</style>

<body>
<canvas id="c" tabindex="0"></canvas>
<div id="vignette"></div>
<div id="ui">
  <div class="brand">
    <div class="eyebrow" id="t-eyebrow">SpaceX · Vehicle study</div>
    <h1 id="t-title">STARSHIP V3</h1>
    <div class="sub" id="t-sub">Super Heavy + Ship</div>
    <div class="mission" id="t-mission" hidden></div>
  </div>
  <nav id="parts"></nav>
  <div id="stats">
    <div><span id="t-height">Height</span><b id="v-height">124.4 m</b></div>
    <div><span id="t-diameter">Diameter</span><b id="v-diameter">9 m</b></div>
    <div class="opt"><span id="t-raptors">Raptors</span><b>39</b></div>
    <div class="opt"><span id="t-thrust">Thrust</span><b id="v-thrust">~90,600 kN</b></div>
    <div class="opt"><span id="t-liftoff">Liftoff mass</span><b id="v-liftoff">~5,300 t</b></div>
    <div><span id="t-selected">Selected</span><b id="station">—</b></div>
  </div>
  <button id="ss-close" aria-label="Close">×</button>
  <button id="theme-btn" aria-label="Day / night"></button>
  <button id="share-btn" aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
  <aside id="card">
    <button class="x" aria-label="Close">×</button>
    <div class="k" id="card-k"></div>
    <h2 id="card-t"></h2>
    <p id="card-d"></p>
    <div class="row" id="card-s"></div>
  </aside>
  <div id="hint">DRAG TO ORBIT AROUND ANY POINT · SCROLL TO ZOOM WHERE YOU POINT · RIGHT-DRAG TO PAN · DOUBLE-CLICK TO FLY THERE · CUBE FOR VIEWS</div>
  <div id="controls">
    <button class="pill" data-act="explode">Explode</button>
    <button class="pill" data-act="stage">Separate</button>
    <button class="pill" data-act="section">Section</button>
    <button class="pill" data-act="flow">Ignition</button>
    <button class="pill" data-act="pause">Pause</button>
    <button class="pill" data-act="scale">Scale</button>
    <button class="pill" data-act="reset">Reset</button>
  </div>
  <div id="nav">
    <div class="views">
      <button class="pill" data-face="4">Side</button><button class="pill" data-face="2">Top</button><button class="pill" data-face="3">Belly</button><button class="pill" data-face="1">Engines</button><button class="pill" data-face="0">Nose</button>
    </div>
    <canvas id="cube" aria-label="View cube: click a face to look from that side"></canvas>
    <div class="navbtns">
      <button data-z="roll" aria-label="Spin on its axis">⟳</button>
      <button data-z="in" aria-label="Zoom in">+</button>
      <button data-z="out" aria-label="Zoom out">−</button>
      <button data-z="fit" aria-label="Fit whole vehicle">⤢</button>
    </div>
  </div>
  <div id="pivot"></div>
  <div id="tip"></div>
  <svg id="scale-svg"></svg>
  <div id="scale-lbls"></div>
</div>
<div id="loader">INITIALIZING</div>

function makeTiles() {
