<style>
  :root{--accent:#eea774;--fg:#e9ecf1;--mute:#7b8392;--line:rgba(255,255,255,.1);--panel:rgba(12,14,19,.74)}
  html,body{margin:0;height:100%;background:#05070b;color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:2}
  .brand{position:absolute;left:28px;top:22px}
  .eyebrow{font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
  .brand h1{margin:9px 0 0;font-weight:500;font-size:44px;letter-spacing:.16em;line-height:1}
  .brand .sub{margin-top:9px;color:var(--accent);font-size:12.5px;letter-spacing:.01em}
  .brand .mission{margin-top:7px;color:#d6dbe3;font-size:13px;font-weight:500;letter-spacing:.01em}
  #parts{position:absolute;left:28px;top:152px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:auto}
  .pill{font:500 11.5px/1 Inter,sans-serif;color:#cfd4dc;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap;transition:background-color .15s,color .15s,border-color .15s}
  .pill:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.26);color:#fff}
  .pill.on{background:var(--accent);color:#1b1208;border-color:var(--accent)}
  .pill i{font-style:normal;opacity:.5;margin-right:7px;font-family:'JetBrains Mono',monospace;font-size:10.5px}
  .pill.on i{opacity:.7}
  .sep{font:500 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:#9aa3b1;margin:6px 0 1px 2px;text-transform:uppercase}
  #stats{position:absolute;right:28px;top:24px;display:flex;gap:24px;font-family:'JetBrains Mono',monospace}
  #stats div{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  #stats span{font-size:11px;letter-spacing:.12em;color:#aeb6c3;text-transform:uppercase}
  #stats b{font-weight:500;font-size:14px;color:var(--fg);white-space:nowrap}
  #card{position:absolute;right:28px;top:80px;width:310px;background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:16px 18px 16px;pointer-events:auto;opacity:0;transform:translateY(-6px);visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s}
  #card.show{opacity:1;transform:none;visibility:visible}
  #card .k{font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:#aeb6c3;text-transform:uppercase}
  #card h2{margin:8px 0 10px;font-size:19px;font-weight:600;letter-spacing:.005em}
  #card p{margin:0;font-size:12.5px;line-height:1.55;color:#c3c9d3}
  #card .row{display:flex;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  #card .row div{flex:1;min-width:0}
  #card .row span{display:block;font:500 10.5px/1.1 'JetBrains Mono',monospace;letter-spacing:.1em;color:#aeb6c3;text-transform:uppercase}
  #card .row b{display:block;margin-top:6px;font:500 11.5px/1.2 'JetBrains Mono',monospace;color:var(--fg)}
  #card .x{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--mute);font-size:16px;cursor:pointer;transition:background-color .15s,color .15s}
  #card .x:hover{background:rgba(255,255,255,.08);color:#fff}
  #controls{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
  #controls .pill{padding:8px 15px}
  #nav{position:absolute;right:22px;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:auto}
  #cube{width:112px;height:112px;cursor:pointer;display:block}
  #nav .navbtns{display:flex;gap:6px}
  #nav .views{display:flex;flex-direction:column;gap:5px;align-items:flex-end;position:absolute;right:124px;bottom:44px}
  #nav .views .pill{padding:6px 11px;font-size:11px}
  #nav .navbtns button{width:32px;height:32px;padding:0;border-radius:50%;font:500 15px/1 Inter,sans-serif;color:#cfd4dc;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:background-color .15s,color .15s,border-color .15s}
  #nav .navbtns button:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff}
  #pivot{position:absolute;left:0;top:0;width:12px;height:12px;margin:-7px 0 0 -7px;border:1.5px solid var(--accent);border-radius:50%;box-shadow:0 0 0 4px rgba(238,167,116,.16);opacity:0;transition:opacity .15s;pointer-events:none}
  #hint{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--mute);white-space:normal;text-align:center;line-height:1.6;width:max-content;max-width:min(1100px,calc(100vw - 520px));transition:opacity .8s;text-transform:uppercase}
  #tip{position:absolute;left:0;top:0;padding:6px 9px;font:500 11px/1 Inter,sans-serif;color:#fff;background:rgba(10,12,16,.86);border:1px solid var(--line);border-radius:7px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap}
  #loader{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#05070b;transition:opacity .7s;font:500 11px 'JetBrains Mono',monospace;letter-spacing:.24em;color:var(--mute);text-transform:uppercase}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
  /* scripts without Latin letters: no Inter/JetBrains glyphs, and wide tracking breaks them apart */
  html:is([lang=he],[lang=ar],[lang=hi],[lang=zh],[lang=ru]) :is(.brand h1,.eyebrow,.sep,#stats span,#card .k,#card .row span,#hint){letter-spacing:.02em}
  html:is([lang=he],[lang=ar]) body{font-family:Heebo,'Noto Sans Arabic',system-ui,sans-serif}
  html:is([lang=he],[lang=ar],[lang=hi],[lang=zh],[lang=ru]) :is(#stats span,#card .k,#card .row span,.sep,.eyebrow){font-family:Heebo,'Noto Sans Arabic',system-ui,sans-serif;font-size:12px;font-weight:500}
  /* right-to-left languages: mirror the whole overlay */
  html[dir=rtl] .brand{left:auto;right:28px;text-align:right}
  html[dir=rtl] #parts{left:auto;right:28px;align-items:flex-end}
  html[dir=rtl] .pill i{margin-right:0;margin-left:7px}
  html[dir=rtl] #stats{right:auto;left:28px}
  html[dir=rtl] #stats div{align-items:flex-start}
  html[dir=rtl] #card{right:auto;left:28px}
  html[dir=rtl] #card .x{right:auto;left:10px}
  html[dir=rtl] #nav{right:auto;left:22px}
  html[dir=rtl] #nav .views{right:auto;left:124px;align-items:flex-start}
  /* embedded in the site: a close button in the site's own style */
  #ss-close{display:none;position:absolute;top:18px;right:22px;width:38px;height:38px;border-radius:50%;border:2px solid #34d399;background:rgba(5,7,11,.55);color:#34d399;font-size:20px;line-height:1;cursor:pointer;pointer-events:auto;transition:background-color .15s,color .15s,border-color .15s;z-index:3}
  #ss-close:hover{background:rgba(52,211,153,.12);color:#6ee7b7;border-color:#6ee7b7}
  html.embed #ss-close{display:grid;place-items:center}
  html.embed #stats{right:82px}
  html.embed[dir=rtl] #ss-close{right:auto;left:22px}
  html.embed[dir=rtl] #stats{right:auto;left:82px}
  @media (max-width:1100px) and (min-width:761px){
    #stats .opt{display:none}
    .brand h1{font-size:36px}
  }
  @media (max-height:720px) and (min-width:761px){
    #parts{gap:5px}
    #parts .pill{padding:5px 11px;font-size:11px}
    .sep{margin:3px 0 0 2px}
  }
  @media (max-height:620px) and (min-width:761px){ #hint{display:none} }
  @media (max-width:760px){
    .brand{left:16px;top:16px}
    .brand h1{font-size:28px}
    .brand .sub{font-size:11.5px}
    #stats{display:none}
    #parts{top:auto;bottom:70px;left:0;right:0;flex-direction:row;overflow-x:auto;padding:4px 16px;scrollbar-width:none;align-items:center}
    #parts::-webkit-scrollbar{display:none}
    .sep{display:none}
    #controls{bottom:max(16px,env(safe-area-inset-bottom));gap:4px}
    #controls .pill{padding:8px 8px;font-size:10.5px}
    #nav{top:12px;right:10px;bottom:auto;gap:6px;align-items:flex-end}
    #cube{width:84px;height:84px}
    #nav .views{display:none}
    #nav .navbtns button{width:28px;height:28px;font-size:13px}
    #card{left:12px;right:12px;width:auto;top:auto;bottom:156px}
    #hint{display:none}
    html[dir=rtl] .brand{right:16px}
    html[dir=rtl] #parts{left:0;right:0;flex-direction:row-reverse}
    html[dir=rtl] #nav{left:10px;right:auto;align-items:flex-start}
    html[dir=rtl] #card{left:12px}
    #ss-close{top:12px;right:10px;width:34px;height:34px}
    html.embed #nav{top:56px}
    html.embed[dir=rtl] #ss-close{left:10px}
  }
</style>

<body>
<canvas id="c" tabindex="0"></canvas>
<div id="vignette"></div>
<div id="ui">
  <div class="brand">
    <div class="eyebrow" id="t-eyebrow">SpaceX · Vehicle study</div>
    <h1 id="t-title">STARSHIP V3</h1>
    <div class="sub" id="t-sub">Super Heavy + Ship · Block 3</div>
    <div class="mission" id="t-mission" hidden></div>
  </div>
  <nav id="parts"></nav>
  <div id="stats">
    <div><span id="t-height">Height</span><b id="v-height">124.4 m</b></div>

    <div class="opt"><span id="t-raptors">Raptors</span><b>39</b></div>
    <div class="opt"><span id="t-thrust">Thrust</span><b id="v-thrust">~90,600 kN</b></div>
    <div class="opt"><span id="t-liftoff">Liftoff mass</span><b id="v-liftoff">~5,300 t</b></div>

    <h2 id="card-t"></h2>
    <p id="card-d"></p>
    <div class="row" id="card-s"></div>
  </aside>
  <div id="hint">DRAG TO ORBIT AROUND ANY POINT · SCROLL TO ZOOM WHERE YOU POINT · RIGHT-DRAG TO PAN · DOUBLE-CLICK TO FLY THERE · CUBE FOR VIEWS</div>
  <div id="controls">
    <button class="pill" data-act="explode">Explode</button>
    <button class="pill" data-act="stage">Separate</button>

      <button class="pill" data-face="4">Side</button><button class="pill" data-face="2">Top</button><button class="pill" data-face="3">Belly</button><button class="pill" data-face="1">Engines</button><button class="pill" data-face="0">Nose</button>

</div>
<div id="loader">INITIALIZING</div>
<script>
  // decide language/direction before first paint so the overlay never flashes in the wrong layout
  (function () { try { const q = new URLSearchParams(location.search); if (q.get('embed')) document.documentElement.classList.add('embed'); } catch (e) {} })();

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const V2 = THREE.Vector2, V3 = THREE.Vector3;
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sstep = x => x * x * (3 - 2 * x);
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

// ---------------------------------------------------------------- language, units, embed
// Language and unit system follow the site when embedded (same-origin iframe: read the parent's
// <html lang> and window.currentUnitSystem, re-checked every 500ms like the site's own label
// dispatcher), or ?lang=/&units= when opened on its own.
const Q = new URLSearchParams(location.search);
const EMBED = !!Q.get('embed');
function langKey(raw) { let k = String(raw || 'en').toLowerCase().split('-')[0]; if (k === 'iw') k = 'he'; return SS_I18N[k] ? k : 'en'; }
function parentDoc() { try { return window.parent !== window ? window.parent.document : null; } catch (e) { return null; } }
function readLang() { const pd = parentDoc(); return langKey((pd && pd.documentElement.lang) || Q.get('lang') || 'en'); }
function readUnits() { try { if (window.parent !== window && window.parent.currentUnitSystem) return window.parent.currentUnitSystem; } catch (e) {} return Q.get('units') === 'imperial' ? 'imperial' : 'metric'; }
function closeEmbed() { try { window.parent.postMessage({ type: 'starship-sim-close' }, location.origin); } catch (e) {} }
const NUM_LOCALE = { en: 'en-US', he: 'he-IL', es: 'es-ES', fr: 'fr-FR', de: 'de-DE', ru: 'ru-RU', zh: 'zh-CN', it: 'it-IT', cs: 'cs-CZ', sv: 'sv-SE', nl: 'nl-NL', da: 'da-DK', pt: 'pt-BR', pl: 'pl-PL', hi: 'hi-IN', ar: 'ar-EG', tr: 'tr-TR' };
let LANG = readLang(), UNITS = readUnits(), I = SS_I18N[LANG];
const nf = (n, d = 0) => new Intl.NumberFormat((NUM_LOCALE[LANG] || 'en-US') + '-u-nu-latn', { maximumFractionDigits: d, minimumFractionDigits: d }).format(n);
function unitValues() {
  const u = I.units, imp = UNITS === 'imperial';
  return imp ? {
    height: `${nf(408)} ${u.ft}`, diameter: `${nf(29.5, 1)} ${u.ft}`, thrust: `~${nf(20400000)} ${u.lbf}`, liftoff: `~${nf(11700000)} ${u.lb}`,
    raptorThrust: `~${nf(617000)} ${u.lbf}`, rvacExit: `~${nf(7.5, 1)} ${u.ft}`, loxTemp: `< −${nf(297)} °F`, ch4Temp: `< −${nf(260)} °F`, tilePeak: `~${nf(2550)} °F`, payload: `${nf(220000)}+ ${u.lb}`,
  } : {
    height: `${nf(124.4, 1)} ${u.m}`, diameter: `${nf(9)} ${u.m}`, thrust: `~${nf(90600)} ${u.kN}`, liftoff: `~${nf(5300)} ${u.t}`,
    raptorThrust: `~${nf(2750)} ${u.kN}`, rvacExit: `~${nf(2.3, 1)} ${u.m}`, loxTemp: `< −${nf(183)} °C`, ch4Temp: `< −${nf(162)} °C`, tilePeak: `~${nf(1400)} °C`, payload: `${nf(100)}+ ${u.t}`,
  };
}
let UV = unitValues();
function fillT(str) { return String(str).replace(/\{(\w+)\}/g, (m, k) => k === 'starlink' ? I.starlink : k === 'starship' ? I.starship : (UV[k] ?? m)); }
// hover labels are built from pieces: "Forward flap (left) · hinge fairing", "Grid fin 2", "Raptor 3 · outer ring 14"
function trLabel(label) {
  return label.split(' · ').map(seg => {
    const m = seg.match(/^(.*?)(?: \((left|right)\))?(?: (\d+))?$/);
    let out = fillT(I.lb[m[1]] ?? m[1]);
    if (m[2]) out += ` (${I.lb[m[2]] ?? m[2]})`;
    if (m[3]) out += ` ${m[3]}`;
    return out;
  }).join(' · ');
}
const $ = id => document.getElementById(id);
function setControlLabels() {
  const b = a => document.querySelector(`[data-act="${a}"]`);
  if (!b('explode')) return;
  b('explode').textContent = st.explodeT ? I.ui.assemble : I.ui.explode;
  b('stage').textContent = st.sepT ? I.ui.stack : I.ui.separate;
  b('section').textContent = I.ui.section; b('flow').textContent = I.ui.flow; b('reset').textContent = I.ui.reset;
  b('pause').textContent = paused ? I.ui.play : I.ui.pause;
}
// the parts list starts just under the title block, which grows by a line when a mission is shown
function placeParts() {
  if (innerWidth <= 760) { partsNav.style.top = ''; return; }
  partsNav.style.top = Math.round(document.querySelector('.brand').getBoundingClientRect().bottom + (innerHeight < 720 ? 14 : 28)) + 'px';
}
addEventListener('resize', placeParts);
function applyI18n() {
  const html = document.documentElement;
  html.lang = LANG; html.dir = I.dir;
  const U = I.ui;
  $('t-eyebrow').textContent = U.eyebrow;
  $('t-title').textContent = `${I.starship.toLocaleUpperCase(LANG)} V3`;   // same naming as the site's "Starship V3"
  $('t-sub').textContent = `Super Heavy + ${I.shipName || 'Ship'} · Block 3`;
  // ?f=14&b=21&bf=1&s=41&sf=1 - flight number, booster/ship serials and how many flights each has flown
  {
    const n = k => { const v = parseInt(Q.get(k), 10); return v > 0 ? v : null; };
    const f = n('f'), b = n('b'), bf = n('bf'), sh = n('s'), sf = n('sf'), bits = [];
    const ft = (tpl, v) => tpl.replace('{n}', nf(v));
    if (f) bits.push(ft(U.mFlight, f));
    if (b) bits.push(`${U.booster} ${b}` + (bf ? ` (${ft(U.vFlight, bf)})` : ''));
    if (sh) bits.push(`Ship ${sh}` + (sf ? ` (${ft(U.vFlight, sf)})` : ''));
    const el = $('t-mission'); el.hidden = !bits.length; el.textContent = bits.join(' · ');
  }
  placeParts();
  document.title = `${I.starship} V3 · 3D`;
  for (const k of ['height', 'diameter', 'raptors', 'thrust', 'liftoff', 'selected']) $('t-' + k).textContent = U[k];
  for (const k of ['height', 'diameter', 'thrust', 'liftoff']) $('v-' + k).textContent = UV[k];
  $('hint').textContent = U.hint;
  const loader = $('loader'); if (loader) loader.textContent = U.loading;
  setControlLabels();
  document.querySelectorAll('#nav .views [data-face]').forEach(b => { b.textContent = U[FACE_KEYS[+b.dataset.face]]; });
  const zb = document.querySelectorAll('#nav .navbtns button');
  zb[0].setAttribute('aria-label', U.zoomIn); zb[1].setAttribute('aria-label', U.zoomOut); zb[2].setAttribute('aria-label', U.fit);
  $('cube').setAttribute('aria-label', U.cube);
  card.querySelector('.x').setAttribute('aria-label', U.close); $('ss-close').setAttribute('aria-label', U.close);
  buildPartsNav(); renderCard(); buildCubeFaces();
}
setInterval(() => {
  const l = readLang(), u = readUnits();
  if (l === LANG && u === UNITS) return;
  LANG = l; UNITS = u; I = SS_I18N[LANG]; UV = unitValues(); applyI18n();
}, 500);
document.getElementById('ss-close').addEventListener('click', closeEmbed);

// ---------------------------------------------------------------- renderer
const isMobile = matchMedia('(pointer:coarse)').matches || innerWidth < 760;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const PR = Math.min(devicePixelRatio, isMobile ? 1.75 : 2);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;           // the scene is static most of the time; shadows are re-rendered only while something moves
renderer.localClippingEnabled = true;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070b);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.5, 3000);

const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: isMobile ? 2 : 4 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(PR);
composer.setSize(innerWidth, innerHeight);

}
function flyToPoint(x, y) {
  const P = worldAt(x, y); if (!P) return;
  const dir = camera.position.clone().sub(controls.target).normalize();
  const d = clamp(camera.position.distanceTo(P) * 0.45, 9, 30);
  userInteracted(); flyTo({ target: P, pos: P.clone().add(dir.multiplyScalar(d)) });
}

// ---------------------------------------------------------------- pointer, wheel and keyboard input
const ptrs = new Map();
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  userInteracted();
  navVel.yaw = navVel.pitch = navVel.px = navVel.py = 0;
  if (ptrs.size === 1) {
    const pan = e.button === 2 || e.button === 1 || e.shiftKey;

  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    gesture = { mode: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, moved: 99 };
  }
});
canvas.addEventListener('pointermove', e => {
  mx = e.clientX; my = e.clientY;
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  if (e.pointerType === 'mouse' && !gesture) mouseDirty = true;
  const p = ptrs.get(e.pointerId); if (!p || !gesture) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;

  } else if (gesture.mode === 'pan' && ptrs.size === 1) {
    panCam(dx, dy); navVel.px = dx; navVel.py = dy; gesture.moved += Math.abs(dx) + Math.abs(dy);
  } else if (gesture.mode === 'pinch' && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    panCam(cx - gesture.mx, cy - gesture.my);
    if (d > 10 && gesture.d > 10) zoomCam(gesture.d / d, worldAt(cx, cy) || controls.target);

});
function endPtr(e) {
  if (!ptrs.delete(e.pointerId)) return;
  if (gesture && gesture.mode !== 'pinch' && gesture.moved < 6 && performance.now() - gesture.t < 450) { navVel.yaw = navVel.pitch = 0; clickAt(e); }
  if (ptrs.size === 0) gesture = null;
  else if (ptrs.size === 1) { gesture = { mode: 'orbit', t: 0, moved: 99 }; navPivot.copy(controls.target); }
  lastInteract = performance.now();
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('pointerleave', () => { hovered = null; tip.style.opacity = 0; });
canvas.addEventListener('wheel', e => {
  e.preventDefault(); userInteracted();
  zoomPt.copy(worldAt(e.clientX, e.clientY) || controls.target);   // off the vehicle, zoom toward the view center
  const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
  zoomPending = clamp(zoomPending + clamp(dy, -240, 240) * 0.0017, -1.6, 1.6);
}, { passive: false });
canvas.addEventListener('dblclick', e => flyToPoint(e.clientX, e.clientY));
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (selected) select(null); else if (EMBED) closeEmbed(); }
  const k = { ArrowLeft: [0.07, 0], ArrowRight: [-0.07, 0], ArrowUp: [0, 0.05], ArrowDown: [0, -0.05] }[e.key];
  if (k) { e.preventDefault(); userInteracted(); navVel.yaw = k[0] * 0.5; navVel.pitch = k[1] * 0.5; navPivot.copy(controls.target); }
  if (e.key === '+' || e.key === '=') { userInteracted(); zoomPt.copy(controls.target); zoomPending -= 0.4; }
  if (e.key === '-' || e.key === '_') { userInteracted(); zoomPt.copy(controls.target); zoomPending += 0.4; }
  if (e.key === 'f' || e.key === 'F') { userInteracted(); flyTo(defaultView()); }
});

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
const ENV_Q = new THREE.Quaternion();
let t = 0, frameNo = 0, perfT = 0, perfN = 0, curPR = PR, lastHover = 0;
function setPR(p) { curPR = p; renderer.setPixelRatio(p); composer.setPixelRatio(p); composer.setSize(innerWidth, innerHeight); }
const hl = new THREE.Color(0xff7a2e);
const vTmp = new V3();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), adt = paused ? 0 : dt;
  t += adt; timeU.value = t; frameNo++;

  const k = r => 1 - Math.exp(-dt * r);
  st.explode += (st.explodeT - st.explode) * k(2.4);
  st.section += (st.sectionT - st.section) * k(2.6);
  st.fire += (st.fireT - st.fire) * k(1.6);
  st.sep += (st.sepT - st.sep) * k(1.8);

  const sepOff = SEP * sstep(clamp(st.sep));
  for (const g of groups) { const p = sstep(clamp(st.explode * 1.25 - g.userData.order / 11 * 0.25)); g.position.y = g.userData.dy * p + (g.userData.ship ? sepOff : 0); }
  const rp = sstep(clamp(st.explode * 1.4 - 0.4));
  for (const rg of radialGroups) rg.position.x = rg.userData.radial * rp;
  layout();
  spin.updateMatrixWorld(true);

  // section plane (model-local)
  clipLocal.constant = 14 * (1 - sstep(clamp(st.section)));
  clipPlane.copy(clipLocal).applyMatrix4(root.matrixWorld);
  const showFluid = st.section > 0.02;
  for (const f of fluids) { f.visible = showFluid; f.material.emissiveIntensity = 0.5 + 0.12 * Math.sin(t * 2 + f.id) + st.fire * 0.25; }

  // engines
  let bSum = 0, sSum = 0;
  // ship engines fire only for hot staging (stages separated); in the exploded view their plumes would
  // shoot straight through the booster's own parts
  const shipGate = sstep(clamp(st.sep * 2 - 1)) * (1 - sstep(clamp(st.explode * 2)));
  for (const en of engines) {
    // ship engines sit on top of the booster when stacked, so they only light once the stages are apart
    const gate = en.stage === 'b-raptors' ? 1 : shipGate;
    const i = sstep(clamp((st.fire * 1.5 - en.delay) / 0.35)) * gate;
    const flick = 0.9 + 0.1 * Math.sin(t * 57 + en.x * 3.1 + en.z * 1.7);
    en.plume.visible = false;
    en.core.material.uniforms.uI.value = i * (en.stage === 'b-raptors' ? 0 : 0.03) * flick;   // booster: the shared plume carries the hot core
    en.glow.material.uniforms.uI.value = i;
    en.core.visible = en.glow.visible = i > 0.002;
    if (en.flame) { en.flame.material.uniforms.uI.value = i * flick; en.flame.visible = i > 0.002; }
    if (en.stage === 'b-raptors') bSum += i; else sSum += i;
  }
  const flick = 0.85 + 0.15 * Math.sin(t * 31) * Math.sin(t * 17.3);
  clusterPlume.material.uniforms.uI.value = (bSum / 33) * (0.95 + 0.05 * flick);
  clusterPlume.visible = bSum > 0.05;
  bFire.intensity = (bSum / 33) * 900 * flick;
  sFire.intensity = (sSum / 6) * 450 * flick;

  // airflow streaks
  const fk = sstep(clamp(st.fire));
  // upright, the plume would be cut off by the stage floor - fade the floor out while firing
  const floorK = vertical ? 1 - fk : 1;
  floorMat.opacity = floorK; ringLine.material.opacity = 0.6 * floorK; floor.visible = ringLine.visible = floorK > 0.01;
  airLines.visible = false;   // the airflow streaks read as stray white lines across the fire; the plume alone reads better
  if (airLines.visible) {
    for (let i = 0; i < AIR_N; i++) {
      air.y[i] -= air.s[i] * adt;
      if (air.y[i] < -30) spawnAir(i, false);
      const y = air.y[i], r = hullR(Math.min(y, NOSE_TOP)) + air.o[i], ca = Math.cos(air.a[i]), sa = Math.sin(air.a[i]);
      const x = sa * r, z = ca * r, j = i * 6;
      airPos[j] = x; airPos[j + 1] = y; airPos[j + 2] = z;
      airPos[j + 3] = x; airPos[j + 4] = y + air.l[i]; airPos[j + 5] = z;
      const fade = 0.11 * clamp((175 - y) / 20) * clamp((y + 30) / 15) * fk * (0.25 + 0.75 * clamp(1 - air.o[i] / 7));
      airCol[j] = 0.55 * fade; airCol[j + 1] = 0.7 * fade; airCol[j + 2] = 1.0 * fade;
      airCol[j + 3] = airCol[j + 4] = airCol[j + 5] = 0;
    }

  }

  propPts.visible = fk > 0.01;
  if (propPts.visible) {
    for (const f of flows) {
      let L = 0; f.len.length = 0;
      f.pts.forEach(([g, x, y, z], i) => { f.cur[i].set(x, y + g.position.y, z); if (i) L += f.cur[i].distanceTo(f.cur[i - 1]); f.len.push(L); });
      f.total = L;
    }
    for (let p = 0; p < PN; p++) {
      const f = flows[pF[p]];
      pU[p] = (pU[p] + adt * 9 / f.total) % 1;
      const d = pU[p] * f.total;
      let s = 1; while (s < f.len.length - 1 && f.len[s] < d) s++;
      const a = f.cur[s - 1], b = f.cur[s], seg = f.len[s] - f.len[s - 1], u = seg > 0 ? (d - f.len[s - 1]) / seg : 0;
      pPos[p * 3] = lerp(a.x, b.x, u) + pJ[p * 3]; pPos[p * 3 + 1] = lerp(a.y, b.y, u) + pJ[p * 3 + 1]; pPos[p * 3 + 2] = lerp(a.z, b.z, u) + pJ[p * 3 + 2];
      const fade = fk * clamp(pU[p] * 8) * clamp((1 - pU[p]) * 8);
      pCol[p * 3] = f.color[0] * fade; pCol[p * 3 + 1] = f.color[1] * fade; pCol[p * 3 + 2] = f.color[2] * fade;
    }
    propGeo.attributes.position.needsUpdate = true; propGeo.attributes.color.needsUpdate = true;
  }

  // highlight
  const pulse = 0.16 + 0.1 * Math.sin(performance.now() / 260);
  for (const id in parts) {
    const kk = id === selected ? pulse : id === hovered ? 0.035 : 0;
    for (const m of parts[id].mats) {
      if (FLUID_KINDS.has(Object.keys(parts[id].cache).find(q => parts[id].cache[q] === m))) continue;
      if (kk > 0) { m.emissive.copy(hl); m.emissiveIntensity = kk; } else if (m.emissiveIntensity !== 0) { m.emissive.setHex(0); m.emissiveIntensity = 0; }
    }
  }

  // camera: fly-to animation, inertia, smooth zoom, idle turntable
  if (camAnim) {
    const kc = k(3.4);
    controls.target.lerp(camAnim.target, kc); camera.position.lerp(camAnim.pos, kc);
    if (camera.position.distanceTo(camAnim.pos) < 0.05 && controls.target.distanceTo(camAnim.target) < 0.05) camAnim = null;
  } else if (!gesture) {
    const decay = Math.pow(0.9, dt * 60);
    if (Math.abs(navVel.yaw) + Math.abs(navVel.pitch) > 1e-4) { orbitCam(navVel.yaw, navVel.pitch, navPivot); navVel.yaw *= decay; navVel.pitch *= decay; }
    if (Math.abs(navVel.px) + Math.abs(navVel.py) > 0.05) { panCam(navVel.px, navVel.py); navVel.px *= decay; navVel.py *= decay; }
    if (autoSpin && !paused) orbitCam(adt * 0.045, 0, controls.target);
  }
  if (Math.abs(zoomPending) > 1e-4) { const step = zoomPending * k(12); zoomPending -= step; zoomCam(Math.exp(step), zoomPt); }
  controls.update();
  camera.updateMatrixWorld();
  // lighting rig rides with the viewer: key from just above-left of the camera, fill from the right, and the
  // studio reflections turned so their softboxes always sit behind you
  {
    const dist = camera.position.distanceTo(controls.target);
    const up = new V3().setFromMatrixColumn(camera.matrixWorld, 1), right = new V3().setFromMatrixColumn(camera.matrixWorld, 0);
    headlight.position.copy(camera.position).addScaledVector(up, dist * 0.35).addScaledVector(right, -dist * 0.25);
    headFill.position.copy(camera.position).addScaledVector(right, dist * 0.6).addScaledVector(up, -dist * 0.15);
    headlight.target.position.copy(controls.target); headlight.target.updateMatrixWorld();
    headFill.target.position.copy(controls.target); headFill.target.updateMatrixWorld();
    scene.environmentRotation.setFromQuaternion(ENV_Q.copy(camera.quaternion).invert());
  }

  // shadows only need re-rendering while parts are moving or being cut
  const moving = Math.abs(st.explode - st.explodeT) + Math.abs(st.sep - st.sepT) + Math.abs(st.section - st.sectionT) > 1e-3;
  if (moving || frameNo < 4) renderer.shadowMap.needsUpdate = true;
  // bloom is only there for the fire, so skip both full-screen passes when nothing is burning
  bloom.enabled = clampPass.enabled = st.fire > 0.01;

  // adaptive resolution: drop the pixel ratio when frames run long, raise it again when there's headroom
  perfT += dt; perfN++;
  if (perfT > 1.2) {
    const avg = perfT / perfN; perfT = perfN = 0;
    if (avg > 0.023 && curPR > 1) setPR(Math.max(1, curPR - 0.25));
    else if (avg < 0.0135 && curPR < PR) setPR(Math.min(PR, curPR + 0.25));
  }

  // pivot marker while orbiting around a grabbed point
  if (gesture && gesture.mode === 'orbit' && gesture.moved > 3) {
    vTmp.copy(navPivot).project(camera);
    pivotDot.style.transform = `translate(${(vTmp.x * 0.5 + 0.5) * innerWidth}px, ${(-vTmp.y * 0.5 + 0.5) * innerHeight}px)`;
    pivotDot.style.opacity = 1;
  } else pivotDot.style.opacity = 0;

  // flames need the camera in their own space; draw back faces when the camera is inside a plume
  for (const f of flames) {
    if (!f.visible) continue;
    f.updateMatrixWorld();
    const c = f.material.uniforms.uCam.value.copy(camera.position); f.worldToLocal(c);
    const { RB, L } = f.userData.bound;
    const inside = c.x * c.x + c.z * c.z < RB * RB && c.y < 0 && c.y > -L;
    f.material.side = inside ? THREE.BackSide : THREE.FrontSide;

  if (mouseDirty && performance.now() - lastHover > 70) {
    mouseDirty = false; lastHover = performance.now();
    const h = pick(), m = h && h.object;
    hovered = m ? m.userData.part : null;
    canvas.style.cursor = m ? 'pointer' : 'grab';
    if (m && m.userData.label) {
      tip.textContent = trLabel(m.userData.label);
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      const tx = mx + 14 + tw > innerWidth - 8 ? mx - 14 - tw : mx + 14, ty = my + 14 + th > innerHeight - 8 ? my - 14 - th : my + 14;
      tip.style.transform = `translate(${Math.max(8, tx)}px, ${Math.max(8, ty)}px)`; tip.style.opacity = 1;
    }
    else tip.style.opacity = 0;
  }
  if (gesture) { canvas.style.cursor = gesture.mode === 'pan' ? 'move' : 'grabbing'; tip.style.opacity = 0; }

  composer.render();
  // view cube follows the main camera's direction
  cubeCam.position.copy(camera.position).sub(controls.target).normalize().multiplyScalar(6);
  cubeCam.up.copy(camera.up); cubeCam.lookAt(0, 0, 0);
  cubeR.render(cubeScene, cubeCam);
  if (frameNo === 2) { const l = document.getElementById('loader'); l.style.opacity = 0; setTimeout(() => l.remove(), 800); }
  requestAnimationFrame(tick);
}

function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); composer.setSize(w, h); renderer.shadowMap.needsUpdate = true;
  const v = h > w * 1.05;
  if (v !== vertical) { vertical = v; applyOrientation(); layout(); if (!userMoved) { const dv = defaultView(); camera.position.copy(dv.pos); controls.target.copy(dv.target); } }
  else if (!userMoved) flyTo(defaultView());
}
addEventListener('resize', onResize);
window.__s = { camera, controls, st, select, spin, flyTo, parts, root, bloom, engines, flames, airLines, propPts, bFire, sFire, faceView, orbitCam, zoomCam, worldAt, look(y, off = [0, 0, 20]) { spin.updateMatrixWorld(true); const p = root.localToWorld(new V3(0, y, 0)); camAnim = null; userMoved = true; autoSpin = false; controls.target.copy(p); camera.position.copy(p).add(new V3(...off)); } };

applyOrientation(); layout(); applyI18n();
// debug hook for screenshots: #dbg={"fire":1,"section":1,"explode":1,"sep":1,"turn":0.4,"face":1,"look":[y,dx,dy,dz],"sel":"b-raptors"}
if (location.hash.startsWith('#dbg=')) setTimeout(() => {
  const d = JSON.parse(decodeURIComponent(location.hash.slice(5)));
  if (d.fire) st.fire = st.fireT = 1;
  if (d.section) st.section = st.sectionT = 1;
  if (d.explode) st.explode = st.explodeT = 1;
  if (d.sep) st.sep = st.sepT = 1;
  paused = !d.run; autoSpin = false; userMoved = true; layout(); camera.updateMatrixWorld();
  const dv = d.face !== undefined ? faceView(d.face) : defaultView(); camAnim = null; camera.position.copy(dv.pos); controls.target.copy(dv.target);
  if (d.turn) orbitCam(d.turn, 0, controls.target);
  if (d.sel) select(d.sel, !d.look);
  if (d.look) setTimeout(() => window.__s.look(d.look[0], d.look.slice(1)), 50);
  if (d.t) { t = d.t; timeU.value = t; }
}, 300);
{ const dv = defaultView(); camera.position.copy(dv.pos); controls.target.copy(dv.target); }
controls.update();
canvas.style.cursor = 'grab';
tick();
</script>
