<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceX Tracker • X Poster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Heebo:wght@300;400;500;700&display=swap');
        body { font-family: 'Heebo', sans-serif; background-color: #09090b; color: #e4e4e7; overflow-x: hidden; }
        .font-space { font-family: 'Space Grotesk', sans-serif; }
        .tweet-box { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-emerald-500 selection:text-black">
    <div class="fixed inset-0 z-0 pointer-events-none opacity-20" style="background: radial-gradient(circle at 50% 0%, #10b981 0%, transparent 50%);"></div>

    <nav class="bg-zinc-950/80 backdrop-blur-md sticky top-0 z-50 border-b border-zinc-800">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-brands fa-x-twitter text-2xl text-white"></i>
                <span class="font-space font-bold text-xl tracking-wider text-white" dir="ltr">SpaceX Tracker <span class="text-emerald-400">Helper</span></span>
            </div>
            <!-- שדה מוגן למפתח ששמור רק אצלך בדפדפן ולא מגיע לגיטהאב -->
            <div class="flex items-center gap-2 text-sm text-zinc-400" dir="ltr">
                <input type="password" id="api-key-input" placeholder="Gemini API Key" class="bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1 text-xs text-white w-36 focus:outline-none focus:border-emerald-500" onchange="saveApiKey(this.value)">
                <span id="api-status" class="text-xs"><i class="fa-solid fa-circle-exclamation text-amber-400"></i> מפתח חסר</span>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full relative z-10 flex flex-col lg:flex-row gap-8">
        <div class="w-full lg:w-1/3 flex flex-col gap-4">
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-lg">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-white">
                    <i class="fa-solid fa-layer-group text-emerald-400"></i> בחר סקטור
                </h2>
                <div class="flex flex-col gap-2">
                    <button onclick="selectSector('upcoming')" id="btn-upcoming" class="sector-btn w-full text-right px-4 py-3 rounded-xl border border-zinc-700 bg-zinc-800 hover:bg-zinc-700 hover:border-emerald-500 transition-all flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-blue-500/10 flex items-center justify-center text-blue-400 shrink-0"><i class="fa-solid fa-clock"></i></div>
                        <div><div class="font-bold text-sm text-white">התרעות שיגור קרוב</div><div class="text-xs text-zinc-400">T-Minus והייפ</div></div>
                    </button>
                    <button onclick="selectSector('past')" id="btn-past" class="sector-btn w-full text-right px-4 py-3 rounded-xl border border-zinc-800 bg-zinc-900/50 hover:bg-zinc-800 hover:border-emerald-500 transition-all flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-purple-500/10 flex items-center justify-center text-purple-400 shrink-0"><i class="fa-solid fa-check-double"></i></div>
                        <div><div class="font-bold text-sm text-white">שיגורי עבר</div><div class="text-xs text-zinc-400">חגיגת השיגור האחרון</div></div>
                    </button>
                    <button onclick="selectSector('starlink')" id="btn-starlink" class="sector-btn w-full text-right px-4 py-3 rounded-xl border border-zinc-800 bg-zinc-900/50 hover:bg-zinc-800 hover:border-emerald-500 transition-all flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-cyan-500/10 flex items-center justify-center text-cyan-400 shrink-0"><i class="fa-solid fa-globe"></i></div>
                        <div><div class="font-bold text-sm text-white">רשת Starlink</div><div class="text-xs text-zinc-400">עדכוני פריסה</div></div>
                    </button>
                    <button onclick="selectSector('recovery')" id="btn-recovery" class="sector-btn w-full text-right px-4 py-3 rounded-xl border border-zinc-800 bg-zinc-900/50 hover:bg-zinc-800 hover:border-emerald-500 transition-all flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-amber-500/10 flex items-center justify-center text-amber-400 shrink-0"><i class="fa-solid fa-ship"></i></div>
                        <div><div class="font-bold text-sm text-white">נחיתות (Recovery)</div><div class="text-xs text-zinc-400">בוסטרים ומנחתים</div></div>
                    </button>
                </div>
            </div>
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-lg">
                <h2 class="text-sm font-bold text-zinc-400 mb-3 uppercase tracking-wider">נתוני הליבה</h2>
                <div id="context-data" class="space-y-3"></div>
            </div>
        </div>

        <div class="w-full lg:w-2/3 flex flex-col gap-4">
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-lg flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold flex items-center gap-2 text-white">
                        <i class="fa-solid fa-pen-nib text-emerald-400"></i> מחולל הציוצים
                    </h2>
                    <button onclick="generateTweets()" class="bg-zinc-800 hover:bg-zinc-700 text-white px-4 py-2 rounded-xl text-sm font-bold border border-zinc-700 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-rotate"></i> רענן אפשרויות
                    </button>
                </div>

                <div class="flex flex-col gap-6">
                    <div class="flex flex-col gap-3">
                        <h3 class="text-emerald-400 font-bold text-sm">אופציה 1</h3>
                        <div class="bg-black border border-zinc-800 rounded-xl p-5 text-white text-[15px]" dir="ltr" id="tweet-output-1">טוען נתונים...</div>
                        <a id="post-btn-1" href="#" target="_blank" class="w-full bg-white text-black font-bold py-2.5 rounded-xl text-center cursor-not-allowed opacity-50">פרסם אופציה 1</a>
                    </div>
                    <div class="h-px w-full bg-zinc-800 my-2"></div>
                    <div class="flex flex-col gap-3">
                        <h3 class="text-emerald-400 font-bold text-sm">אופציה 2</h3>
                        <div class="bg-black border border-zinc-800 rounded-xl p-5 text-white text-[15px]" dir="ltr" id="tweet-output-2">טוען נתונים...</div>
                        <a id="post-btn-2" href="#" target="_blank" class="w-full bg-white text-black font-bold py-2.5 rounded-xl text-center cursor-not-allowed opacity-50">פרסם אופציה 2</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let liveUpcomingLaunches = [];
        let latestPastLaunch = null;
        let currentSector = 'upcoming';

        function getApiKey() {
            return localStorage.getItem('gemini_api_key') || '';
        }

        function saveApiKey(val) {
            const trimmed = val.trim();
            localStorage.setItem('gemini_api_key', trimmed);
            if (trimmed) {
                document.getElementById('api-status').innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> מחובר';
                generateTweets();
            } else {
                document.getElementById('api-status').innerHTML = '<i class="fa-solid fa-circle-exclamation text-amber-400"></i> מפתח חסר';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = getApiKey();
            if (savedKey) {
                document.getElementById('api-key-input').value = savedKey;
                document.getElementById('api-status').innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> מחובר';
            }
            loadSpaceXDataFromCache();
        });

        function getSafePadName(launch) {
            try {
                if (launch.pad?.location?.name) return launch.pad.location.name.split(',')[0];
                if (launch.pad?.name) return launch.pad.name;
            } catch(e) {}
            return "SpaceX Launch Pad";
        }

        function loadSpaceXDataFromCache() {
            try {
                const cachedData = localStorage.getItem('spacex_launches_cache');
                if (cachedData) {
                    const allLaunches = JSON.parse(cachedData);
                    const now = new Date().getTime();
                    liveUpcomingLaunches = allLaunches.filter(l => new Date(l.net).getTime() > now).sort((a,b) => new Date(a.net) - new Date(b.net));
                    const past = allLaunches.filter(l => new Date(l.net).getTime() <= now).sort((a,b) => new Date(b.net) - new Date(a.net));
                    if (past.length > 0) latestPastLaunch = past[0];
                    updateContextUI();
                    generateTweets();
                }
            } catch (error) {
                console.error("Cache error:", error);
            }
        }

        function updateContextUI() {
            let html = '';
            if (currentSector === 'upcoming' && liveUpcomingLaunches[0]) {
                html = `<div class="bg-zinc-800/50 p-3 rounded-xl border border-zinc-700/50 text-sm" dir="ltr"><span class="text-emerald-400 font-bold">Next:</span> ${liveUpcomingLaunches[0].name}</div>`;
            } else if (currentSector === 'past' && latestPastLaunch) {
                html = `<div class="bg-zinc-800/50 p-3 rounded-xl border border-purple-500/30 text-sm" dir="ltr"><span class="text-purple-400 font-bold">Latest:</span> ${latestPastLaunch.name}</div>`;
            }
            document.getElementById('context-data').innerHTML = html || '<div class="text-zinc-500 text-sm">אין נתונים פעילים</div>';
        }

        function selectSector(sector) {
            currentSector = sector;
            document.querySelectorAll('.sector-btn').forEach(b => b.classList.remove('border-emerald-500', 'bg-zinc-800'));
            document.getElementById(`btn-${sector}`)?.classList.add('border-emerald-500', 'bg-zinc-800');
            updateContextUI();
            generateTweets();
        }

        async function generateTweets() {
            const apiKey = getApiKey();
            const out1 = document.getElementById('tweet-output-1');
            const out2 = document.getElementById('tweet-output-2');
            const btn1 = document.getElementById('post-btn-1');
            const btn2 = document.getElementById('post-btn-2');

            if (!apiKey) {
                out1.innerText = "נא להזין מפתח Gemini API בתיבה למעלה בסרגל.";
                out2.innerText = "נא להזין מפתח Gemini API בתיבה למעלה בסרגל.";
                return;
            }

            out1.innerText = "מייצר ציוצי AI...";
            out2.innerText = "מייצר ציוצי AI...";

            let sectorContext = `Current sector: ${currentSector}.`;
            if (currentSector === 'upcoming' && liveUpcomingLaunches[0]) {
                sectorContext = `Upcoming launch: ${liveUpcomingLaunches[0].name}, time: ${liveUpcomingLaunches[0].net}`;
            }

            const prompt = `You are a social media manager for @SpaceXFansTrack. Based on "${sectorContext}", write TWO short, distinct, hype-building tweets about SpaceX with emojis and hashtags. Return ONLY a raw JSON array with two strings: ["tweet1", "tweet2"] without any markdown formatting.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                let rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                const aiResult = JSON.parse(rawText);

                out1.innerText = aiResult[0];
                btn1.href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(aiResult[0])}`;
                btn1.classList.remove('cursor-not-allowed', 'opacity-50');

                out2.innerText = aiResult[1];
                btn2.href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(aiResult[1])}`;
                btn2.classList.remove('cursor-not-allowed', 'opacity-50');

            } catch (e) {
                out1.innerText = "שגיאה בחיבור ל-API. בדוק שהמפתח תקין.";
                out2.innerText = "שגיאה בחיבור ל-API. בדוק שהמפתח תקין.";
            }
        }

        loadSpaceXDataFromCache();
    </script>
</body>
</html>
