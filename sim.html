<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starship V3 • Interactive 3D</title>

<link rel="canonical" href="https://spacexfantracker.com/sim.html">

<!-- Share target of the 3D sim's Share button. Link previews read these tags (crawlers don't run the
     site's JavaScript, so the home page's own tags can't show the sim); people are sent straight on
     into the sim on the site, keeping the flight / part in the query string. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="SpaceX Launch Tracker">
<meta property="og:title" content="Starship V3 • Interactive 3D">
<meta property="og:description" content="Explore SpaceX's Starship V3 and Super Heavy in interactive 3D: every part, the Raptor engines, hot staging and the Starlink dispenser.">
<meta property="og:image" content="https://spacexfantracker.com/starship-sim-share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="Starship V3 hot staging in the interactive 3D model">
<meta property="og:url" content="https://spacexfantracker.com/sim.html">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Starship V3 • Interactive 3D">
<meta name="twitter:description" content="Explore SpaceX's Starship V3 and Super Heavy in interactive 3D: every part, the Raptor engines, hot staging and the Starlink dispenser.">
<meta name="twitter:image" content="https://spacexfantracker.com/starship-sim-share.jpg">
<meta name="twitter:image:alt" content="Starship V3 hot staging in the interactive 3D model">

<script>
(function(){
  if (/Twitterbot|facebookexternalhit|Facebot|Slackbot|WhatsApp|TelegramBot|LinkedInBot|Discordbot|Pinterest|SkypeUriPreview|Applebot/i.test(navigator.userAgent||"")) return;
  var q = new URLSearchParams(location.search), out = new URLSearchParams({ sim: '1' });
  ['f', 'b', 'bf', 's', 'sf', 'n', 'part'].forEach(function (k) { if (q.get(k)) out.set(k, q.get(k)); });
  location.replace(location.pathname.replace(/[^/]*$/, '') + '?' + out.toString());
})();
</script>
<style>
:root{color-scheme:dark}
body{margin:0;background:#05070b;color:#e4e4e7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}
img{width:min(92vw,720px);border-radius:1rem;border:1px solid #27272a}
a{display:inline-block;margin-top:1.5rem;background:#10b981;color:#022c22;font-weight:700;text-decoration:none;padding:.85rem 1.4rem;border-radius:.85rem}
</style>
</head>
<body>
<div>
<img src="starship-sim-share.jpg" alt="Starship V3 hot staging in the interactive 3D model">

</div>
</body>
