<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>Launch Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #02040a;
    --panel: rgba(8, 12, 22, 0.62);
    --panel-border: rgba(120, 190, 255, 0.16);
    --text: #e7eef8;
    --muted: #8ea0b8;
    --accent: #5fd4ff;
    --accent-2: #34d399;
    --booster: #ffae42;
    --est: #c9a2ff;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Rubik', system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  .label3d { font: 500 12px/1.2 'Rubik', sans-serif; color: var(--text); background: rgba(5, 10, 20, 0.55); border: 1px solid rgba(255, 255, 255, 0.12); padding: 2px 7px; border-radius: 999px; white-space: nowrap; pointer-events: none; transform: translateY(-14px); backdrop-filter: blur(4px); }
  .label3d.ev { font-size: 11px; color: #cfe9ff; border-color: rgba(95, 212, 255, 0.35); }
  .label3d.ev.booster { color: #ffd9a3; border-color: rgba(255, 174, 66, 0.4); }
  .label3d.ev.est { color: #e3d0ff; border-color: rgba(201, 162, 255, 0.45); border-style: dashed; }
  .label3d.veh { font-weight: 700; color: #fff; border-color: rgba(95, 212, 255, 0.6); }
  .label3d.veh.booster { border-color: rgba(255, 174, 66, 0.7); }
  .label3d.site { color: #b8f5d6; border-color: rgba(52, 211, 153, 0.45); }

  .panel { position: fixed; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px; backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); box-shadow: 0 10px 40px -12px rgba(0, 0, 0, 0.7); }
  #hud-top { top: 16px; inset-inline-start: 16px; padding: 14px 18px; min-width: 300px; max-width: 360px; }
  #hud-top .mission { font: 700 13px 'Orbitron', 'Rubik', sans-serif; letter-spacing: 0.1em; color: var(--accent); direction: ltr; text-align: start; unicode-bidi: plaintext; }
  #hud-top .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #clock { font: 700 38px/1.1 'Orbitron', sans-serif; letter-spacing: 0.04em; margin-top: 8px; direction: ltr; text-align: start; }
  [dir="rtl"] #clock { text-align: right; }
  #simtime { font-size: 11.5px; color: var(--muted); margin-top: 1px; text-align: start; unicode-bidi: plaintext; }
  [dir="rtl"] #simtime { text-align: right; }
  #phase { font-size: 14px; margin-top: 6px; color: #fff; min-height: 2.6em; }
  #phase small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  #phase .est { color: var(--est); font-size: 11px; }
  .tele { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .tele div { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px; padding: 7px 8px; min-width: 0; }
  .tele b { display: block; font: 700 17px 'Orbitron', sans-serif; direction: ltr; text-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  [dir="rtl"] .tele b { text-align: right; }
  .tele span { font-size: 11px; color: var(--muted); }

  #events { top: 16px; inset-inline-end: 16px; width: 300px; max-height: calc(100vh - 170px); overflow: auto; padding: 10px; scrollbar-width: thin; }
  #events h3 { margin: 4px 8px 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .ev-row { display: grid; grid-template-columns: 74px 1fr; gap: 8px; padding: 8px; border-radius: 10px; cursor: pointer; transition: background 0.2s; }
  .ev-row:hover { background: rgba(255, 255, 255, 0.05); }
  .ev-row .t { font: 500 11.5px 'Orbitron', sans-serif; color: #71717a; direction: ltr; text-align: start; padding-top: 3px; white-space: nowrap; }
  .ev-row .n { overflow-wrap: anywhere; }
  .ev-row .head { display: flex; align-items: center; gap: 6px; }
  .ev-row .chk { width: 11px; height: 11px; flex: none; color: #3f3f46; opacity: 0.5; }
  .ev-row .lbl { font: 700 14px 'Orbitron', 'Rubik', sans-serif; color: #34d399; }
  .ev-row .n small { display: block; font-size: 12.5px; color: #a1a1aa; margin-top: 2px; line-height: 1.35; }
  .ev-row:not(.done) .lbl, .ev-row:not(.done) small, .ev-row:not(.done) .estTag { opacity: 0.55; }
  .ev-row.done .chk { color: #34d399; opacity: 1; }
  .ev-row .estTag { font: 400 11px 'Rubik', sans-serif; color: #a1a1aa; }

  /* the cinematic view: only the picture (a faint button in the corner brings everything back) */
  body.cine #hud-top, body.cine #events, body.cine #controls, body.cine #credit, body.cine #close { opacity: 0; pointer-events: none; }
  #hud-top, #events, #controls, #credit, #close { transition: opacity 0.35s; }
  #cine-exit { display: none; position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); inset-inline-end: 14px; z-index: 6; width: 40px; height: 40px; border-radius: 999px; padding: 0; opacity: 0.35; background: rgba(8, 12, 22, 0.6); }
  #cine-exit:hover { opacity: 1; }
  body.cine #cine-exit { display: grid; place-items: center; }
  body.cine .label3d { opacity: 0; }
  /* the second view, during a landing: the frame drawn round where it is rendered */
  #pip-frame { display: none; position: fixed; z-index: 3; border: 1px solid rgba(120, 190, 255, 0.45); border-radius: 12px; pointer-events: none; box-shadow: 0 8px 30px -10px rgba(0, 0, 0, 0.8); }
  #pip-frame.on { display: block; }
  #pip-label { position: absolute; top: 6px; inset-inline-start: 8px; font: 600 11px 'Rubik', sans-serif; color: #e7eef8; background: rgba(5, 10, 20, 0.6); padding: 2px 8px; border-radius: 999px; }
  body.cine #pip-frame { border-color: transparent; }
  #close { position: fixed; top: 16px; inset-inline-end: 362px; width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; font-size: 22px; line-height: 1; padding: 0; z-index: 5; background: rgba(8, 12, 22, 0.7); border: 1px solid rgba(255, 255, 255, 0.18); backdrop-filter: blur(8px); }

  #controls { left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(1020px, calc(100vw - 32px)); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  @media (min-width: 761px) {
    #controls .row:first-child { flex-wrap: nowrap; }
    #controls .row:first-child > * { white-space: nowrap; flex-shrink: 0; }
    #controls.tight1 .row { gap: 4px; }
    #controls.tight1 button { padding: 7px 8px; }
    #controls.tight1 .sep { margin: 0 1px; }
    #controls.tight2 .lbl { display: none; }
    #controls.tight2 #speed-auto::before { content: '⏩ '; }
    #controls.tight2 [data-cam="auto"]::before { content: '🎥 '; }
    #controls.tight3 button { padding: 6px 6px; font-size: 12px; }
    #controls.tight3 #play { width: 36px; }
    #controls.tight4 .row:first-child { flex-wrap: wrap; }
  }
  button { font: 500 13px 'Rubik', sans-serif; color: var(--text); background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 7px 11px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  @media (hover: hover) { button:hover { background: rgba(255, 255, 255, 0.12); } }
  button.on { background: rgba(95, 212, 255, 0.18); border-color: rgba(95, 212, 255, 0.55); color: #fff; }
  #play { width: 44px; font-size: 15px; }
  #live { font-weight: 700; }
  #live.gone { display: none; }
  #live.wait { opacity: 0.6; cursor: default; }
  #live.wait::before { color: #71717a; }
  #live::before { content: '●'; color: #ef4444; margin-inline-end: 5px; }
  #live.on { background: rgba(239, 68, 68, 0.22); border-color: rgba(239, 68, 68, 0.75); color: #fff; }
  #live.avail:not(.on)::before { animation: livePulse 1.2s ease-in-out infinite; }
  @keyframes livePulse { 50% { opacity: 0.25; } }
  .sep { width: 1px; height: 24px; background: rgba(255, 255, 255, 0.12); margin: 0 3px; }
  .lbl { font-size: 12px; color: var(--muted); }
  .lbl .ico { display: none; }
  .scrubwrap { position: relative; flex: 1; min-width: 0; display: flex; padding-top: 8px; }
  #scrub { flex: 1; direction: ltr; accent-color: var(--accent); min-width: 0; margin: 0; }
  /* one mark per event, where it falls on the bar (the thumb's 8px either end kept clear): grey to come, green done, as in the list */
  #ticks { position: absolute; left: 8px; right: 8px; top: 0; height: 9px; pointer-events: none; }
  .tk { position: absolute; top: 1px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: #52525b; pointer-events: auto; cursor: pointer; box-shadow: 0 0 0 1.5px rgba(2, 4, 10, 0.85); }
  .tk.done { background: #34d399; }
  .tk:hover { transform: scale(1.5); }
  #note { font-size: 11px; color: var(--muted); line-height: 1.4; }
  /* the imagery's credit (its licence asks for one): a faint line under the controls, outside them */
  #credit { position: fixed; left: 0; right: 0; bottom: 2px; font-size: 9px; color: var(--muted); opacity: 0.55; direction: ltr; text-align: center; pointer-events: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
  #credit a { color: inherit; }
  #ev-toggle { display: none; }
  #mbar, #mpop { display: none; }
  #mpop { position: fixed; z-index: 7; min-width: 180px; max-width: calc(100vw - 20px); padding: 6px; border-radius: 14px; background: rgba(10, 16, 28, 0.94); border: 1px solid rgba(255, 255, 255, 0.14); backdrop-filter: blur(14px); box-shadow: 0 12px 40px -10px rgba(0, 0, 0, 0.8); }
  #mpop.open { display: block; }
  #mpop button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: start; background: transparent; border: 0; border-radius: 9px; padding: 10px 12px; font-size: 14px; }
  #mpop button.on { background: rgba(95, 212, 255, 0.16); color: #fff; }
  #mpop button.on::after { content: '✓'; margin-inline-start: auto; color: var(--accent); }
  #mpop button:disabled { opacity: 0.45; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 10; font: 500 14px 'Rubik', sans-serif; color: var(--muted); transition: opacity 0.6s; text-align: center; padding: 24px; }
  /* not enough room beside the readout for the close button inside the timeline: back to the corner */
  @media (min-width: 761px) and (max-width: 900px) { #close { inset-inline-end: 16px; } #events { inset-inline-end: 72px; } }
  @media (max-width: 760px) {
    #hud-top { top: 10px; inset-inline-start: 10px; inset-inline-end: 64px; min-width: 0; max-width: none; padding: 10px 12px; }
    #hud-top .sub { display: none; }
    #clock { font-size: 26px; margin-top: 4px; }
    #phase { font-size: 13px; min-height: 0; }
    #phase small { font-size: 11px; }
    .tele { gap: 6px; margin-top: 8px; }
    .tele div { padding: 5px 6px; }
    .tele b { font-size: 14px; }
    .tele span { font-size: 10px; }
    #close { top: 10px; inset-inline-end: 10px; }
    #events { inset-inline-end: 10px; }
    #events { display: none; top: auto; bottom: calc(env(safe-area-inset-bottom) + 150px); inset-inline-start: 10px; inset-inline-end: 10px; width: auto; max-height: 42vh; }
    body.ev-open #events { display: block; }
    #ev-toggle { display: inline-block; }
    #controls { width: calc(100vw - 20px); bottom: max(16px, env(safe-area-inset-bottom)); padding: 8px 10px; gap: 6px; }
    .row { gap: 4px; }
    button { padding: 6px 8px; font-size: 12px; }
    .sep, .lbl { display: none; }
    /* the two Auto buttons told apart without their group labels */
    #speed-auto::before { content: '⏩ '; }
    [data-cam="auto"]::before { content: '🎥 '; }
    #note { font-size: 10px; }
    /* one row of play + time bar, then three chips (speed, camera, more) that open small menus */
    #controls .row:first-child { display: none; }
    #controls { gap: 8px; padding: 10px 12px; }
    #mbar { display: flex; gap: 6px; order: 2; }                 /* (under the time bar) */
    .mchip { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; padding: 8px 10px; }
    #m-more { flex: 0 0 46px; font-size: 18px; line-height: 1; padding: 6px 0; }
    #controls .row.scrub-row { gap: 8px; flex-wrap: nowrap; }
    #controls .row.scrub-row #play { flex: none; width: 40px; height: 36px; padding: 0; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="loading"></div>

<div id="hud-top" class="panel">
  <div class="mission" id="mission"></div>
  <div class="sub" id="sub"></div>
  <div id="clock">T-00:00:00</div>
  <div id="simtime" dir="auto"></div>
  <div id="phase"></div>
  <div class="tele">
    <div><b id="alt">0</b><span id="alt-l"></span></div>
    <div><b id="spd">0</b><span id="spd-l"></span></div>
    <div><b id="dr">0</b><span id="dr-l"></span></div>
  </div>
</div>

<button id="close" type="button" aria-label="Close">×</button>
<button id="cine-exit" type="button" aria-label="">✕</button>
<div id="pip-frame"><span id="pip-label"></span></div>
<div id="events" class="panel"><h3 id="ev-h"></h3><div id="ev-list"></div></div>

<div id="controls" class="panel">
  <div class="row">
    <button id="play" type="button">⏸</button>
    <button type="button" id="live"></button>
    <div class="sep"></div>
    <span class="lbl"><span class="ico" aria-hidden="true">⏩</span><span id="speed-l"></span></span>
    <button type="button" data-speed="auto" class="on" id="speed-auto"></button>
    <button type="button" data-speed="1">x1</button>
    <button type="button" data-speed="10">x10</button>
    <button type="button" data-speed="100">x100</button>
    <button type="button" data-speed="1000">x1000</button>
    <div class="sep"></div>
    <span class="lbl"><span class="ico" aria-hidden="true">🎥</span><span id="cam-l"></span></span>
    <button type="button" data-cam="auto" class="on"></button>
    <button type="button" data-cam="chase"></button>
    <button type="button" data-cam="booster"></button>
    <button type="button" data-cam="pad"></button>
    <button type="button" data-cam="earth"></button>
    <button type="button" id="ev-toggle"></button>
    <button type="button" id="cine" aria-label="">🎬</button>
  </div>
  <div id="mbar"><button type="button" class="mchip" id="m-speed"></button><button type="button" class="mchip" id="m-cam"></button><button type="button" class="mchip" id="m-more" aria-label="…">⋯</button></div>
  <div class="row scrub-row"><div class="scrubwrap"><div id="ticks" dir="ltr"></div><input id="scrub" type="range" min="-20" max="6000" step="1" value="-20" aria-label="Time"></div></div>
</div>
<div id="mpop" role="menu"></div>
<div id="credit">Imagery: NASA Blue Marble (NASA EOSDIS GIBS) · USGS The National Map (USDA NAIP) · <a href="https://s2maps.eu" target="_blank" rel="noopener">Sentinel-2 cloudless</a> by EOX IT Services GmbH (contains modified Copernicus Sentinel data 2016 &amp; 2017)</div>

<script>
