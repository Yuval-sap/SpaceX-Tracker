<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>Launch Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #02040a;
    --panel: rgba(8, 12, 22, 0.62);
    --panel-border: rgba(120, 190, 255, 0.16);
    --text: #e7eef8;
    --muted: #8ea0b8;
    --accent: #5fd4ff;
    --accent-2: #34d399;
    --booster: #ffae42;
    --est: #c9a2ff;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Rubik', system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  .label3d { font: 500 12px/1.2 'Rubik', sans-serif; color: var(--text); background: rgba(5, 10, 20, 0.55); border: 1px solid rgba(255, 255, 255, 0.12); padding: 2px 7px; border-radius: 999px; white-space: nowrap; pointer-events: none; transform: translateY(-14px); backdrop-filter: blur(4px); }
  .label3d.ev { font-size: 11px; color: #cfe9ff; border-color: rgba(95, 212, 255, 0.35); }
  .label3d.ev.booster { color: #ffd9a3; border-color: rgba(255, 174, 66, 0.4); }
  .label3d.ev.est { color: #e3d0ff; border-color: rgba(201, 162, 255, 0.45); border-style: dashed; }
  .label3d.veh { font-weight: 700; color: #fff; border-color: rgba(95, 212, 255, 0.6); }
  .label3d.veh.booster { border-color: rgba(255, 174, 66, 0.7); }
  .label3d.site { color: #b8f5d6; border-color: rgba(52, 211, 153, 0.45); }

  .panel { position: fixed; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px; backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); box-shadow: 0 10px 40px -12px rgba(0, 0, 0, 0.7); }
  #hud-top { top: 16px; inset-inline-start: 16px; padding: 14px 18px; min-width: 300px; max-width: 360px; }
  #hud-top .mission { font: 700 13px 'Orbitron', 'Rubik', sans-serif; letter-spacing: 0.1em; color: var(--accent); direction: ltr; text-align: start; unicode-bidi: plaintext; }
  #hud-top .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #clock { font: 700 38px/1.1 'Orbitron', sans-serif; letter-spacing: 0.04em; margin-top: 8px; direction: ltr; text-align: start; }
  [dir="rtl"] #clock { text-align: right; }
  #simtime { font-size: 11.5px; color: var(--muted); margin-top: 1px; text-align: start; unicode-bidi: plaintext; }
  [dir="rtl"] #simtime { text-align: right; }
  #phase { font-size: 14px; margin-top: 6px; color: #fff; min-height: 2.6em; }
  #phase small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  #phase .est { color: var(--est); font-size: 11px; }
  .tele { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .tele div { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px; padding: 7px 8px; min-width: 0; }
  .tele b { display: block; font: 700 17px 'Orbitron', sans-serif; direction: ltr; text-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  [dir="rtl"] .tele b { text-align: right; }
  .tele span { font-size: 11px; color: var(--muted); }

  #events { top: 16px; inset-inline-end: 72px; width: 300px; max-height: calc(100vh - 170px); overflow: auto; padding: 10px; scrollbar-width: thin; }
  #events h3 { margin: 4px 8px 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .ev-row { display: grid; grid-template-columns: 74px 1fr; gap: 8px; padding: 8px; border-radius: 10px; cursor: pointer; transition: background 0.2s; }
  .ev-row:hover { background: rgba(255, 255, 255, 0.05); }
  .ev-row .t { font: 500 11.5px 'Orbitron', sans-serif; color: #71717a; direction: ltr; text-align: start; padding-top: 3px; white-space: nowrap; }
  .ev-row .n { overflow-wrap: anywhere; }
  .ev-row .head { display: flex; align-items: center; gap: 6px; }
  .ev-row .chk { width: 11px; height: 11px; flex: none; color: #3f3f46; opacity: 0.5; }
  .ev-row .lbl { font: 700 14px 'Orbitron', 'Rubik', sans-serif; color: #34d399; }
  .ev-row .n small { display: block; font-size: 12.5px; color: #a1a1aa; margin-top: 2px; line-height: 1.35; }
  .ev-row:not(.done) .lbl, .ev-row:not(.done) small, .ev-row:not(.done) .estTag { opacity: 0.55; }
  .ev-row.done .chk { color: #34d399; opacity: 1; }
  .ev-row .estTag { font: 400 11px 'Rubik', sans-serif; color: #a1a1aa; }

  #close { position: fixed; top: 16px; inset-inline-end: 16px; width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; font-size: 22px; line-height: 1; padding: 0; z-index: 5; background: rgba(8, 12, 22, 0.7); border: 1px solid rgba(255, 255, 255, 0.18); backdrop-filter: blur(8px); }

  #controls { left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(1020px, calc(100vw - 32px)); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  button { font: 500 13px 'Rubik', sans-serif; color: var(--text); background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 7px 11px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  @media (hover: hover) { button:hover { background: rgba(255, 255, 255, 0.12); } }
  button.on { background: rgba(95, 212, 255, 0.18); border-color: rgba(95, 212, 255, 0.55); color: #fff; }
  #play { width: 44px; font-size: 15px; }
  #live { display: none; font-weight: 700; }
  #live.avail { display: inline-block; }
  #live::before { content: '●'; color: #ef4444; margin-inline-end: 5px; }
  #live.on { background: rgba(239, 68, 68, 0.22); border-color: rgba(239, 68, 68, 0.75); color: #fff; }
  #live.avail:not(.on)::before { animation: livePulse 1.2s ease-in-out infinite; }
  @keyframes livePulse { 50% { opacity: 0.25; } }
  .sep { width: 1px; height: 24px; background: rgba(255, 255, 255, 0.12); margin: 0 3px; }
  .lbl { font-size: 12px; color: var(--muted); }
  .lbl .ico { display: none; }
  #scrub { flex: 1; direction: ltr; accent-color: var(--accent); min-width: 0; }
  #note { font-size: 11px; color: var(--muted); line-height: 1.4; }
  #credit { font-size: 10px; color: var(--muted); opacity: 0.75; direction: ltr; text-align: start; }
  #credit a { color: inherit; }
  #ev-toggle { display: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 10; font: 500 14px 'Rubik', sans-serif; color: var(--muted); transition: opacity 0.6s; text-align: center; padding: 24px; }
  @media (max-width: 760px) {
    #hud-top { top: 10px; inset-inline-start: 10px; inset-inline-end: 64px; min-width: 0; max-width: none; padding: 10px 12px; }
    #hud-top .sub { display: none; }
    #clock { font-size: 26px; margin-top: 4px; }
    #phase { font-size: 13px; min-height: 0; }
    #phase small { font-size: 11px; }
    .tele { gap: 6px; margin-top: 8px; }
    .tele div { padding: 5px 6px; }
    .tele b { font-size: 14px; }
    .tele span { font-size: 10px; }
    #close { top: 10px; inset-inline-end: 10px; }
    #events { display: none; top: auto; bottom: calc(env(safe-area-inset-bottom) + 150px); inset-inline-start: 10px; inset-inline-end: 10px; width: auto; max-height: 42vh; }
    body.ev-open #events { display: block; }
    #ev-toggle { display: inline-block; }
    #controls { width: calc(100vw - 20px); bottom: max(10px, env(safe-area-inset-bottom)); padding: 8px 10px; gap: 6px; }
    .row { gap: 4px; }
    button { padding: 6px 8px; font-size: 12px; }
    .sep, .lbl { display: none; }
    /* the two Auto buttons told apart without their group labels */
    #speed-auto::before { content: '⏩ '; }
    [data-cam="auto"]::before { content: '🎥 '; }
    #note { font-size: 10px; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="loading"></div>

<div id="hud-top" class="panel">
  <div class="mission" id="mission"></div>
  <div class="sub" id="sub"></div>
  <div id="clock">T-00:00:00</div>
  <div id="simtime" dir="auto"></div>
  <div id="phase"></div>
  <div class="tele">
    <div><b id="alt">0</b><span id="alt-l"></span></div>
    <div><b id="spd">0</b><span id="spd-l"></span></div>
    <div><b id="dr">0</b><span id="dr-l"></span></div>
  </div>
</div>

<button id="close" type="button" aria-label="Close">×</button>
<div id="events" class="panel"><h3 id="ev-h"></h3><div id="ev-list"></div></div>

<div id="controls" class="panel">
  <div class="row">
    <button id="play" type="button">⏸</button>
    <button type="button" id="live"></button>
    <div class="sep"></div>
    <span class="lbl"><span class="ico" aria-hidden="true">⏩</span><span id="speed-l"></span></span>
    <button type="button" data-speed="auto" class="on" id="speed-auto"></button>
    <button type="button" data-speed="1">x1</button>
    <button type="button" data-speed="10">x10</button>
    <button type="button" data-speed="100">x100</button>
    <button type="button" data-speed="1000">x1000</button>
    <div class="sep"></div>
    <span class="lbl"><span class="ico" aria-hidden="true">🎥</span><span id="cam-l"></span></span>
    <button type="button" data-cam="auto" class="on"></button>
    <button type="button" data-cam="chase"></button>
    <button type="button" data-cam="booster"></button>
    <button type="button" data-cam="pad"></button>
    <button type="button" data-cam="earth"></button>
    <button type="button" id="ev-toggle"></button>
  </div>
  <div class="row"><input id="scrub" type="range" min="-20" max="6000" step="1" value="-20" aria-label="Time"></div>
  <div id="note"></div>
  <div id="credit">Imagery: NASA Blue Marble (NASA EOSDIS GIBS) · <a href="https://s2maps.eu" target="_blank" rel="noopener">Sentinel-2 cloudless</a> by EOX IT Services GmbH (contains modified Copernicus Sentinel data 2016 &amp; 2017)</div>
</div>

  for (let i = 0; i < TRAIL_N; i++) if (trailAge[i] < 1) trailAge[i] = Math.min(1, trailAge[i] + dt * (0.12 + Math.min(speed, 200) * 0.004));
  trailGeo.attributes.position.needsUpdate = trailGeo.attributes.age.needsUpdate = trailGeo.attributes.color.needsUpdate = true;
  const si = simT <= 0 ? 0 : idxAt(s2Path, simT);
  s2Done.geometry.instanceCount = si;
  setTip(s2Tip, s2Path[si].p, pS2, simT > 0);
  lineMats.forEach(m => m.resolution.set(innerWidth, innerHeight));

  sites.forEach(o => { const d = camera.position.distanceTo(o.getWorldPosition(tmp)); o.scale.setScalar(Math.max(0.0015, d * 0.012)); o.children[0].visible = d < 9; o.material.opacity = ground ? 0 : 1; });
  evMarkers.forEach(({ e, m, l }) => {
    m.material.opacity = simT >= e.t ? 1 : 0.45;
    const d = camera.position.distanceTo(m.position);
    m.scale.setScalar(Math.max(0.006, d * 0.018));
    m.visible = !ground;
    l.visible = !ground && !MOBILE && camMode !== 'earth' && camMode !== 'orbit' && d < 6 && simT - e.t > -12 && simT - e.t < 25;
  });

  // camera
  if (camMode === 'orbit' && !userCam) {
    const p = s2At(simT), up = p.clone().normalize();
    let v = vel(s2At, simT); v.sub(up.clone().multiplyScalar(v.dot(up))).normalize();
    const side = new THREE.Vector3().crossVectors(v, up).normalize();
    camera.position.copy(p).addScaledVector(up, 0.6).addScaledVector(v, -1.5).addScaledVector(side, 0.55);
    controls.target.copy(p);
    lastTarget = p.clone();
  } else if (camMode === 'chase' || camMode === 'booster' || camMode === 'orbit') {
    const focus = focusFn(camTarget)(simT);
    if (lastTarget) camera.position.add(tmp.copy(focus).sub(lastTarget));
    controls.target.copy(focus);
    lastTarget = focus.clone();
  } else if ((camMode === 'pad' || camMode === 'site') && !userCam) {
    // on the ground: at the pad, or at the landing site of what is landing
    let base;
    if (camMode === 'pad') base = earthGroup.localToWorld(ecef(PAD.lat, PAD.lon, 0));
    else if (camTarget === 'sides') { const sd = boosterDefs.filter(b => b.who === 'side'); base = earthGroup.localToWorld(sd[0].landFixed.clone().add(sd[1].landFixed).multiplyScalar(0.5)); }
    else if (camTarget === 'booster') { const bd = focusBooster(); base = earthGroup.localToWorld((bd.landFixed || ecef(PAD.lat, PAD.lon, 0)).clone()); }
    else base = earthGroup.localToWorld(ecef(PAD.lat, PAD.lon, 0));
    const up = base.clone().normalize(), east = Y.clone().cross(up).normalize(), north = up.clone().cross(east);
    const far = VEH === 'ss' ? 0.013 : 0.012;
    groundUp.copy(up);
    camera.position.copy(base).addScaledVector(up, 0.0012).addScaledVector(east, far).addScaledVector(north, camMode === 'site' ? far * 0.35 : 0);
    const look = camMode === 'pad' ? (simT < 4 ? base.clone().addScaledVector(up, VEH === 'ss' ? 0.0022 : 0.0019) : pS2) : focusFn(camTarget)(simT);
    controls.target.copy(look);
  }
  setCamUp(camMode === 'earth' ? Y : ground && !userCam ? groundUp : controls.target.lengthSq() > 1e-9 ? tmp.copy(controls.target).normalize() : Y);
  // The whole-Earth view turns about the Earth's centre, so the wheel would take the camera straight through the
  // ground: there it stops 30 km up, and zooming and turning slow down with the height, as they do on a map.
  if (controls.target.lengthSq() < R * R * 0.25) {
    const dist = camera.position.length(), h = Math.max(0.02, dist - R);
    controls.minDistance = R + 0.03; controls.zoomSpeed = Math.max(0.06, Math.min(1, 1.6 * h / dist)); controls.rotateSpeed = Math.max(0.03, Math.min(1, 1.3 * h / dist));
  } else { controls.minDistance = 0.002; controls.zoomSpeed = 1; controls.rotateSpeed = 1; }
  controls.update();
  // (and no camera, however it is dragged, goes under the ground)
  if (camera.position.length() < R + 0.0004) camera.position.setLength(R + 0.0004);
  updateTiles(dt);

  // HUD
  $('clock').textContent = fmtT(simT);
  const minute = Math.floor((T0 + simT * 1000) / 60000);
  if (minute !== lastSimMinute) {
    lastSimMinute = minute;
    try { $('simtime').textContent = '🕓 ' + new Date(minute * 60000).toLocaleString(LANG === 'he' ? 'he-IL' : LANG, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' }); } catch (e) {}
  }
  const showB = camTarget === 'booster' || camTarget === 'sides';
  const fb = showB ? focusBooster() : null;
  const fpos = fb && simT >= fb.sep ? fb.at(simT) : pS2;
  const ffn = fb && simT >= fb.sep ? fb.at : s2At;
  const altKm = Math.max(0, fpos.length() / SCALE - RE);
  const gs = simT <= 0 ? 0 : toFixed(ffn(simT + 0.5), simT + 0.5).distanceTo(toFixed(ffn(simT - 0.5), simT - 0.5)) / SCALE * 3600;
  const drKm = fb && simT >= fb.sep ? Math.acos(Math.min(1, toFixed(fpos, simT).normalize().dot(ecef(PAD.lat, PAD.lon, 0).normalize()))) * RE : s2DrAt(simT);
  const k = mi ? 0.621371 : 1;
  $('alt').textContent = (altKm * k).toFixed(altKm < 10 ? 1 : 0);
  $('spd').textContent = Math.round(gs * k).toLocaleString('en-US');
  $('dr').textContent = Math.round(drKm * k).toLocaleString('en-US');
  let cur = null;
  EVENTS.forEach(e => { const done = simT >= e.t; e.row.classList.toggle('done', done); if (done) cur = e; });
  EVENTS.forEach(e => { const on = e === cur && simT - e.t < (e.t > 600 ? 120 : 25); if (on && !e.row.classList.contains('now')) { e.row.classList.add('now'); e.row.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } else if (!on) e.row.classList.remove('now'); });
  const phase = $('phase');
  const key = simT < 0 ? 'cd' : cur ? cur.t + '|' + LANG : '';
  if (phase.dataset.k !== key) {
    phase.dataset.k = key; phase.innerHTML = '';
    if (simT < 0) { phase.append(I.countdown); const s = document.createElement('small'); s.textContent = I.onPad.replace('{v}', VEH_NAME); phase.append(s); }
    else if (cur) { const t = document.createElement('span'); t.dir = 'auto'; t.textContent = cur.title; phase.append(t); if (cur.est) { const e = document.createElement('span'); e.className = 'est'; e.textContent = ' · ' + I.est; phase.append(e); } if (cur.explain) { const s = document.createElement('small'); s.textContent = cur.explain; phase.append(s); } }
  }
  renderer.render(scene, camera);
  labels.render(scene, camera);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight);
  trail.material.uniforms.scale.value = innerHeight;
});
// follow the site's language / units live
setInterval(() => { const l = readLang(), u = readUnits(); if (l !== LANG || u !== UNITS) { LANG = l; UNITS = u; uiTexts(); $('phase').dataset.k = ''; lastSimMinute = null; } }, 500);
uiTexts();
autoCamNow(true);
markCam('auto');
setInterval(() => {
  $('live').classList.toggle('avail', liveAvail());
  // the launch moved (a hold, a scrub): the hero has its new T-0 - start over on it
  try { const c = P && P.getLaunchSimConfig && P.getLaunchSimConfig(); if (c && c.name === cfg.name && isFinite(c.t0) && (!T0_KNOWN || Math.abs(c.t0 - T0) > 999)) location.reload(); } catch (e) {}
}, 1000);
$('live').classList.toggle('avail', liveAvail());
if (liveAvail() && Q.get('live') !== '0') setLive(true);
$('loading').style.opacity = '0';
setTimeout(() => $('loading').remove(), 700);
window.__lsim = { EVENTS, A, boosterDefs, SHOTS, END_T, AZIMUTH, INC, orbitKind, OFFICIAL_ALT, DR_K, seek: (t) => { setLive(false); seek(t); }, get t() { return simT; }, get live() { return live; },
  tiles: () => { const o = {}; tiles.forEach(t => { const k = t.lv.id; o[k] = o[k] || { vis: 0 }; o[k][t.state] = (o[k][t.state] || 0) + 1; if (t.mesh.visible) o[k].vis++; }); return { o, tileSpeed, tilesOff: tilesOff.g || tilesOff.e, off: tilesOff, total: tiles.size }; },
  lookDown: (lat, lon, altKm) => { document.querySelector('[data-cam="earth"]').click(); camera.position.copy(toInertial(ecef(lat, lon, altKm), simT)); },
  dbg: { s2At, toFixed, RE, SCALE, seco1, sepT, secoAlt, camera, VEH, shipCatch, hasFairing, isDragon, isStarlink, padLabel: PAD_LABEL },
  sunElev: (t) => Math.round(Math.asin(toInertial(ecef(PAD.lat, PAD.lon, 0), t).normalize().dot(sunDir(T0 + t * 1000))) / DEG * 10) / 10, T0, PAD,
  probe: (t, b) => { const fn = b ? boosterDefs[0].at : s2At; return { alt: Math.round((fn(t).length() / SCALE - RE) * 10) / 10, kmh: Math.round(toFixed(fn(t + 0.5), t + 0.5).distanceTo(toFixed(fn(t - 0.5), t - 0.5)) / SCALE * 3600) }; } };
requestAnimationFrame(frame);
</script>
